# realize-* skill closest to the work, consistently: `port` = the block OWNS a pinned public API + its contract/fake (a0: the :supporto
# API; b1: the kernel port LetturaCoerente + LetturaCoerenteContratto + Finta); `adapter` = rewiring inside adapters, persistence,
# test source sets or the :avvio composition against an API already owned (b2, a1–a4, c1–c3; same choice as sintesi's avvio-sintesi
# and avvio-coda-condivisa, composition = adapter/piattaforma); `ui` = presenter-only change in :ui (c4). No aggregate, no read-model,
# no application-service: no domain rule and no command changes.
# ORDER (after: is the only order the tool reads; `wave` only satisfies owner-before-consumer): a0 → {b1 → b2 ‖ a1} → a2 (after a1, b2)
# → a3 → a4 → c1 → c2 → c3 → c4. a1 is the only block allowed to run alongside b1/b2.
# BOUNDARIES: two, both in-process — supporto-api (owner a0) and lettura-coerente (owner b1). Nothing is REUSED from another feature's
# boundaries (kernel types are touched only through ADR 0029's new port). The composition objects of c1/c3 (PorteProgetto,
# CollaboratoriProgetto) are :avvio-internal and ordered by after:, not boundaries.
# AC NUMBERING: consolidamento-local prefix AC-C1..AC-C90 (never collides with trascrizione-con-parlanti's AC-1..AC-636 nor sintesi's
# AC-S1..AC-S180). Test names start with the tag followed by a space (`AC-C12 `), JVM-safe, greppable per block. Existing ACs that a
# block RETARGETS keep their own ids in the test names (ADR 0030 §3); the AC-C criterion that governs them cites them. New items take
# the next free number; never renumber. `(by-construction)` items cannot fail — listed for completeness, NOT counted as coverage.
# tests_nl_status: `confirmed` = HIGH-VALUE block whose drafted tests_nl the USER CONFIRMED unchanged at the rule-5 checkpoint
# (user checkpoint 2026-09-27): a0-supporto-moduli, b1-lettura-coerente-primitiva, b2-lettura-coerente-migrazione,
# c3-composizione-piatta (model_hint deep on a0, b1, c3); `draft` = drafted from the ADRs, lower stakes, confirmation optional.
# AMENDED 2026-09-27 (user checkpoint answers, delta only): RitentaConBackoff constructor (lavoro, segnalazione, attesaIniziale,
# attesaMassima) CONFIRMED in boundary supporto-api; a1 gains :modelli tests + pre-release lines 50/51 (AC-C86); a4 gains the rotating
