      - "AC-C81 RegistrazioniPresenter, RegistrazionePresenter and SorgentiParlanti declare no nullable function-typed (or bundle-typed) collaborator and no `= null` default for one; no `if (x == null)` / `x?.let` branch on such a collaborator remains"
      - "AC-C82 A missed wiring no longer hides a function: omitting any one collaborator in the single composition fails compilation (throwaway probe, not committed)"
      - "AC-C83 Presenter tests pass a Finta for every collaborator; the screen states covered today (empty, loading, error, data; queue/ritrascrivi/elimina actions available) stay green with every collaborator present, and :ui:renderCheck stays green"
      - "AC-C84 The two :ui AC-S119 cases are deleted — RegistrazioneSchedeTest 'AC-S119 senza SorgenteRiassuntoS3 …' and RegistrazioneUiStatoTest 'AC-S119 senza lo slot Riassunto …' — and no other test asserts behaviour for an absent collaborator"
      - "AC-C85 The presenters' KDoc and dev-architecture #presenter describe mandatory collaborators (no release feature flags); :ui src/main has no reference to R0/R1/R2 modes"
    notes: "PRE-RELEASE (features/sintesi/pre-release.md): closes no line (U1 is analysis evidence). ADR 0030 §4 also names 'the single test Ambiente' for c4: on the :avvio side it is delivered by c3 (AC-C79); here only :ui presenter fixtures lose their R1-shaped defaults (e.g. pannello = null in the tab/mark render fixtures, pre-release line 128's second clause — tick 128 only if its other clauses are also covered)."
    sources: "ADR 0030 §1 (Presenters), §3 (AC-S119 rows), §4 (c4), dev-architecture-app.md #presenter, analisi-design.md §2.6 U1, tactical-model.md (no domain change)"
boundaries:
  - id: "supporto-api"
    owner: "a0-supporto-moduli"
    consumers:
      - "b1-lettura-coerente-primitiva"
      - "a1-supporto-test-adozione"
      - "a2-ritenta-documento"
      - "a3-ritenta-parlanti"
      - "a4-supporto-avvio"
      - "c3-composizione-piatta"
    projection: "in-process"
    pinned_types:
      "Segnalazione (snastro.supporto)": "public fun interface Segnalazione { public fun segnala(messaggio: String, causa: Throwable?) } — the ONLY logging channel; :supporto never touches JUL; :avvio injects the JUL-backed implementation"
      "RitentaConBackoff (snastro.supporto)": "public class RitentaConBackoff<K>(lavoro: suspend (K) -> Boolean /* true = done, false = retry */, segnalazione: Segnalazione, attesaIniziale: Duration, attesaMassima: Duration) { public fun avvia(scope: CoroutineScope): Job; public fun richiedi(chiave: K) } — keys coalesce over a conflated signal; bounded exponential backoff (doubling from attesaIniziale, capped at attesaMassima); segnala on every failure (key + cause, cause null for a false return) and once on recovery; a failed key is retried until success or scope cancel; rethrows CancellationException and every Error, never runCatching around them (constructor shape CONFIRMED by the user, checkpoint 2026-09-27)"
      "gestoreErroriNonCatturati (snastro.supporto)": "public fun gestoreErroriNonCatturati(segnala: Segnalazione): CoroutineExceptionHandler"
      "figlioDi (snastro.supporto)": "public fun figlioDi(genitore: CoroutineScope, dispatcher: CoroutineDispatcher? = null, gestore: CoroutineExceptionHandler): CoroutineScope — child scope with a SupervisorJob tied to the parent's Job"
      "catturaNonFatale (snastro.supporto)": "public inline fun <T> catturaNonFatale(blocco: () -> T): Result<T> — rethrows CancellationException and VirtualMachineError, catches everything else; the one sanctioned catch-all at the edges (CR-7)"
      "attendiFinche (snastro.supporto.test)": "public fun attendiFinche(timeout: Duration = 5.seconds, messaggio: String, condizione: () -> Boolean) — polls with a short sleep, fails with AssertionError(messaggio)"
      "OrologioFinto (snastro.supporto.test)": "public class OrologioFinto(inizio: Instant, zona: ZoneId = ZoneOffset.UTC) : java.time.Clock { public fun avanza(durata: Duration); public fun imposta(istante: Instant) }"
      "conScopeDiProva (snastro.supporto.test)": "public fun <T> conScopeDiProva(blocco: (CoroutineScope) -> T): T — runs the block and cancels the scope in finally; plus StandardTestDispatcher helpers for runTest + backgroundScope"
      "excluded (ADR 0028 §4)": "no context type, id, Esito, ErroreDominio or business rule; no claim/run/complete template; EsitoAtteso stays in :kernel testFixtures"
    keys:
      "K (RitentaConBackoff key)": "minted by the CONSUMER block, never by :supporto — a2: the Registrazione id as String (RegistrazioneId.valore, UUID v4 minted by AggiungiRegistrazione, immutable); a3: the key AbbonatoRiallineamentoImpronte coalesces on today, unchanged; coalescing uses equals()"
    contract_test: "consumer-driven"
    related_adrs:
      - "0028"
  - id: "lettura-coerente"
    owner: "b1-lettura-coerente-primitiva"
    consumers:
      - "b2-lettura-coerente-migrazione"
      - "c1-porte-progetto"
      - "c3-composizione-piatta"
    projection: "in-process"
    pinned_types:
      "LetturaCoerente (:kernel, snastro.kernel)": "public interface LetturaCoerente { public fun <T> inLettura(blocco: () -> T): T } — ONE consistent snapshot, read-only; infra faults throw (ADR 0003), no Esito"
      "UnitaDiLavoro (:kernel, unchanged)": "public interface UnitaDiLavoro { public fun <T> inTransazione(blocco: () -> Esito<T>): Esito<T> } — signature and UnitaDiLavoroContratto unchanged"
      "semantics (ADR 0029 §2, binding)": "one per-thread state shared by both ports (depth, mode none|write|read, doom flags): 1 outermost inLettura → BEGIN DEFERRED + PRAGMA query_only = 1; 2 inLettura in inTransazione joins, sees uncommitted writes; 3 inLettura in inLettura joins; 4 inTransazione in inLettura → IllegalStateException before any effect; 5 a write in a read fails hard (SQLITE_READONLY / Finta refuses); 6 an exception in a nested inLettura dooms the enclosing inTransazione; 7 no leak: query_only 0 and mode none before the connection goes back"
      "UnitaDiLavoroSql (:persistenza)": "public class UnitaDiLavoroSql(db: SnastroDatabase) : UnitaDiLavoro, LetturaCoerente — its ThreadLocal<Stato> gains the mode; the composition passes the SAME instance as the project's LetturaCoerente and as DispatcherEventiInMemoria's delegate; the dispatcher's wrapper does not wrap LetturaCoerente"
      "DriverSqliteImmediato (:persistenza)": "per-thread begin mode, IMMEDIATE by default (writes byte-identical), DEFERRED only for the outermost read set by UnitaDiLavoroSql; the slot-clearing on a failed BEGIN applies to both modes"
      "checkpointDopoCommit (:persistenza, snastro.persistenza)": "public fun SnastroDatabase.checkpointDopoCommit() — registers PRAGMA wal_checkpoint(TRUNCATE) after the current transaction commits (joins the caller's transaction, as ParlanteRepositorySql:84 does today); dropped on rollback; one checkpoint per call"
      "LetturaCoerenteContratto (:kernel testFixtures)": "abstract class; Ambiente { lettura: LetturaCoerente; unitaDiLavoro: UnitaDiLavoro /* same state */; scrivi(effetto: String); effetti(): List<String>; leggi(): Set<String> /* through lettura */ }; cases 1–7 of ADR 0029 §4; subclasses: Finta (:kernel), UnitaDiLavoroSql and UnitaDiLavoroSql behind DispatcherEventiInMemoria.unitaDiLavoro (:persistenza)"
      "UnitaDiLavoroFinta (:kernel testFixtures)": "ONE class implementing UnitaDiLavoro and LetturaCoerente (one depth counter, one mode); val transazioneAperta (unchanged), val letturaAperta; refuses scrivi while a read is open"
    keys: {}
    contract_test: "consumer-driven"
    related_adrs:
      - "0006"
      - "0012"
      - "0029"
