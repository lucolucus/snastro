    what: "Replace every private attendi/attendiFinche copy, every Thread.sleep used to wait or to separate instants, and every hand-cancelled test scope in the test source sets of :avvio (first: most copies and the flakes), :ui, :audio, :progetto, :sintesi and :modelli with :supporto-test's attendiFinche, OrologioFinto and conScopeDiProva/backgroundScope. The known flakes RitrascriviR2Test AC-458/459/479, RegistrazioneAttesaTest AC-417 and RegistrazioneSomiglianzaTest AC-536 become deterministic, and :modelli's concurrency tests get a deterministic start barrier. Test source sets only; testFixtures copies stay until M2/S5 (ADR 0028 §5)."
