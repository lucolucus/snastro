    consumes: []
    after: []
    related_adrs:
      - "0002"
      - "0028"
    model_hint: "deep"
    tests_nl_status: "confirmed"
    what: "Create the two domain-free technical libraries of ADR 0028: :supporto (only kotlinx-coroutines-core, no project dependency) with the pinned first-cut API RitentaConBackoff, Segnalazione, gestoreErroriNonCatturati, figlioDi, catturaNonFatale, and :supporto-test (kotlin-test, junit-jupiter, kotlinx-coroutines-test) with attendiFinche, OrologioFinto, conScopeDiProva, each implemented and unit-tested. Add the allowlist rows and the test-only rule to verificaDipendenzeModuli, the Konsist rules CR-18a/b/c plus 'no snastro.supporto.test in src/main or src/testFixtures', and the two ADR 0028 scripts with red-green fixtures, then activate them in ADR 0028's enforced_by. No consumer is migrated here."
    tests_nl:
      - "AC-C1 `./gradlew check` is green with :supporto and :supporto-test in settings.gradle.kts (dirs ./supporto, ./supporto-test; packages snastro.supporto / snastro.supporto.test); both apply snastro.kotlin-jvm + snastro.explicit-api and NOT java-test-fixtures; :supporto declares only kotlinx-coroutines-core, :supporto-test only kotlin-test, junit-jupiter, kotlinx-coroutines-test; neither build file contains `project(`"
      - "AC-C2 verificaDipendenzeModuli has the rows \":supporto\" to emptySet() and \":supporto-test\" to emptySet(), and :supporto in the sets of every *:adattatori and :ui. Throwaway probes (not committed) each make the task FAIL: implementation(project(\":supporto\")) in :kernel, in :trascrizione:dominio, in :sintesi:applicazione, in :persistenza; implementation(project(\":kernel\")) in :supporto"
      - "AC-C3 Test-only rule: testImplementation(project(\":supporto-test\")) passes in :kernel and in :avvio; the same edge as implementation, api, testFixturesImplementation or testFixturesApi each FAILs the task, and any configuration of it in :llama-jni FAILs (probes, not committed)"
      - "AC-C4 Konsist, one throwaway probe per rule (not committed), each makes :architettura-test FAIL and the tree passes: CR-18a a file in snastro.supporto importing snastro.kernel.Esito; CR-18b a declaration `RitentaRegistrazione` in :supporto (token list sourced once from context-map.md: at least Progetto, Registrazione, Elaborazione, Trascritto, Voce, Segmento, Parlante, Impronta, Attribuzione, Documento, Riassunto, Fonte); CR-18c an extra public `fun extra()` in :supporto, and the removal of any pinned declaration; `import snastro.supporto.test.attendiFinche` under ui/src/main and under ui/src/testFixtures"
      - "AC-C5 RitentaConBackoff coalesces: richiedi(k) three times before the job for k starts → the job runs ONCE for k; richiedi(k1), richiedi(k2) → both run once (runTest, virtual time)"
      - "AC-C6 RitentaConBackoff backs off: attesaIniziale 1 s, attesaMassima 4 s, a job returning false five times then true → six runs separated by 1, 2, 4, 4, 4 s of virtual time; segnala is called once per failure with a message naming the key, and once on recovery with causa = null"
      - "AC-C7 RitentaConBackoff never drops a key silently: a job throwing IllegalStateException for k → segnala(message naming k, that exception) and k is retried; after 10 consecutive failures k is still scheduled; after scope.cancel() no further run and no segnala"
      - "AC-C8 RitentaConBackoff rethrows fatal throwables: a job throwing an Error subclass (e.g. StackOverflowError) is NOT reported as a retry — it escapes the worker to the scope's CoroutineExceptionHandler; a CancellationException stops the worker with no segnala call. The file contains no runCatching"
      - "AC-C9 figlioDi(genitore, dispatcher, gestore): a launch failing in the child goes to `gestore` and cancels neither the parent nor a sibling child (SupervisorJob tied to the parent's Job); cancelling the parent cancels the child; with dispatcher = null the child runs on the parent's dispatcher, otherwise on the given one"
      - "AC-C10 gestoreErroriNonCatturati(segnala): an exception escaping a launch on a scope carrying it → segnala called exactly once with that throwable"
      - "AC-C11 catturaNonFatale table test: a value → Result.success(value); RuntimeException and IOException → Result.failure; CancellationException, OutOfMemoryError and StackOverflowError (VirtualMachineError) are rethrown"
      - "AC-C12 :supporto-test: attendiFinche returns as soon as the condition turns true and otherwise fails after `timeout` with an AssertionError whose message contains `messaggio`; OrologioFinto(inizio).instant() == inizio, avanza(5.seconds) moves it exactly 5 s, imposta(t) sets t, zone defaults to UTC; conScopeDiProva cancels its scope in finally even when the block throws an AssertionError (scope.isActive is false afterwards)"
      - "AC-C13 architettura-test/controlli-adr/adr-0028-supporto-senza-progetti.sh and adr-0028-supporto-test-solo-nei-test.sh exist with red-green fixtures under fixture/<check>/ for every FAIL clause of ADR 0028 (project(/rootProject/rootDir/../ in either build file; :supporto-test in a non-test configuration incl. testFixtures*; `import snastro.supporto.test` under */src/main or */src/testFixtures, comment lines stripped), validated via ControlliAdrTest (bash -c); both exit 0 on the tree; ADR 0028's PLANNED comments are replaced by real `- check:` + `from: a0-supporto-moduli` entries and `MM lint --adrs .mismagent/decisions` is clean"
      - "AC-C14 (by-construction) no consumer is migrated in this block: no src/main outside ./supporto references snastro.supporto — the migration is a1–a4"
    notes: "PRE-RELEASE (features/sintesi/pre-release.md): closes no line by itself — it is the enabler of lines 42, 82, 119, 171, 172, 124, 179 (closed by a1, a2, a4). The API signatures are pinned in boundary supporto-api (the ADR fixes semantics; the RitentaConBackoff constructor (lavoro, segnalazione, attesaIniziale, attesaMassima) was CONFIRMED by the user at the 2026-09-27 checkpoint — see Dependencies). CR-18c's list and ADR 0028 §2 must stay equal: adding a public declaration amends the ADR. Keep EsitoAtteso in :kernel testFixtures (ADR 0028 §3)."
    sources: "ADR 0028 §1–§7 + enforced_by (PLANNED), code-rules.md CR-2 note + CR-18a/b/c, dev-architecture-app.md #test + #dipendenze-test, architecture.md module map/edges, analisi-design.md §2.4 X5/X8/X11, §2.7 T1/T2, tactical-model.md (no domain change)"
  - id: "b1-lettura-coerente-primitiva"
    type: "port"
    context: "piattaforma"
    side: "app"
    wave: 2
    release: "R3c"
    module: ":kernel (LetturaCoerente.kt + testFixtures LetturaCoerenteContratto, UnitaDiLavoroFinta), :persistenza (UnitaDiLavoroSql, DriverSqliteImmediato, checkpointDopoCommit)"
    title: "Porta kernel LetturaCoerente (BEGIN DEFERRED + query_only), contratto, Finta, UnitaDiLavoroSql su due porte, checkpointDopoCommit"
    consumes:
      - "supporto-api"
    after:
      - "a0-supporto-moduli"
    related_adrs:
      - "0003"
      - "0006"
      - "0012"
      - "0029"
    model_hint: "deep"
    tests_nl_status: "confirmed"
    what: "Add the kernel port LetturaCoerente (inLettura returns T, infra faults throw) and the separate abstract LetturaCoerenteContratto (cases 1–7 of ADR 0029 §4) in :kernel testFixtures, with UnitaDiLavoroFinta implementing both ports on one depth counter and one mode. In :persistenza make UnitaDiLavoroSql implement UnitaDiLavoro and LetturaCoerente on its one per-thread state, give DriverSqliteImmediato a per-thread begin mode (IMMEDIATE by default, DEFERRED + PRAGMA query_only = 1 only for the outermost read, always reset), add checkpointDopoCommit(), and prove snapshot (8) and no-queueing (9) on SQL. UnitaDiLavoro and UnitaDiLavoroContratto stay unchanged; no consumer is migrated here."
    tests_nl:
      - "AC-C15 LetturaCoerenteContratto case 1 — inLettura returns the block's value and sees committed state — passes on its three subclasses: the Finta's test (:kernel), UnitaDiLavoroSql, and UnitaDiLavoroSql behind DispatcherEventiInMemoria.unitaDiLavoro (:persistenza); the Ambiente exposes lettura and unitaDiLavoro backed by the same state, scrivi(effetto), effetti(), leggi()"
      - "AC-C16 Case 2: inLettura nested in inTransazione joins it and sees the transaction's uncommitted write; on SQL no second BEGIN is issued and no pragma is set"
      - "AC-C17 Case 3: inLettura nested in inLettura joins (one read transaction; the inner sees what the outer sees)"
      - "AC-C18 Case 4: inTransazione called inside inLettura throws IllegalStateException BEFORE running its block (block never entered, effetti() unchanged)"
      - "AC-C19 Case 5: a write inside inLettura fails and leaves no effect — on SQL it surfaces SQLITE_READONLY from query_only; the Finta refuses scrivi while letturaAperta"
      - "AC-C20 Case 6 (no leak): an exception thrown in inLettura propagates to the caller; the next outermost inTransazione on the same thread commits normally, its write is readable afterwards and it is NOT read-only (query_only back to 0, mode back to none; on SQL it begins BEGIN IMMEDIATE)"
      - "AC-C21 Case 7: an exception in an inLettura nested in inTransazione dooms the whole unit — no effect is committed even when the outer block catches the exception and returns Ok"
      - "AC-C22 UnitaDiLavoro.kt and UnitaDiLavoroContratto are byte-unchanged and every existing UnitaDiLavoroContratto subclass stays green (git diff of both files is empty)"
      - "AC-C23 SQL-only case 8 (snapshot): inside ONE inLettura on thread A, SELECT 1 runs, then thread B commits a write (latch-driven), then SELECT 2 on A does NOT see B's write; a new inLettura after A ends does"
      - "AC-C24 SQL-only case 9 (no queueing): while thread B holds an open BEGIN IMMEDIATE (latched, uncommitted), inLettura on thread A completes and returns the committed state within 1 s — far below the 5 s busy_timeout, no SQLITE_BUSY; latch-driven via :supporto-test attendiFinche, no Thread.sleep"
      - "AC-C25 DriverSqliteImmediato keeps writes byte-identical: the outermost inTransazione still issues BEGIN IMMEDIATE (asserted on the issued statement), the existing ADR 0006 (b) tests stay green; a fault-injected failing BEGIN DEFERRED leaves the per-thread mode reset and the transaction slot cleared, so the next inTransazione on that thread begins BEGIN IMMEDIATE"
      - "AC-C26 checkpointDopoCommit(): called inside an inTransazione that commits → PRAGMA wal_checkpoint(TRUNCATE) runs exactly once, after the commit; inside one that rolls back → it never runs; two calls in one transaction → two checkpoints (no dedup, user Q-1 2026-09-25)"
      - "AC-C27 UnitaDiLavoroFinta is ONE class implementing UnitaDiLavoro and LetturaCoerente: letturaAperta is true only inside the outermost inLettura, transazioneAperta keeps its current meaning, and the existing Finta tests stay green"
    notes: "PRE-RELEASE (features/sintesi/pre-release.md): closes line 175 (\"a thrown trova marks the caller transaction failed\") by DECISION, not by code: ADR 0029 §2 rule 6 [user B3] makes the doom the contract and AC-C21 pins it — tick it `[x] … · decided by ADR 0029 §2.6, pinned by AC-C21`. Line 170 is closed by b2 (the primitive alone does not change TrascrittoRepositorySql). The event-publishing wrapper does NOT wrap LetturaCoerente (ADR 0029 §3). There is no SnastroDatabase.inLettura entry point. SQL-only tests use the :supporto-test helpers (hence consumes supporto-api)."
    sources: "ADR 0029 §1–§4, §7 + Consequences (ADR 0012 amendment (e), ADR 0006 amendment (c)), code-rules.md CR-3b, dev-architecture-app.md #repository + #porta-contratto, analisi-design.md §2.4 X1, tactical-model.md (no domain change)"
