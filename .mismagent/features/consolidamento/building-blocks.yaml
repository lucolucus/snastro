# WORKTREE RULE (this project): block worktrees live OUTSIDE the project root, in
# /Users/lucaparsani/projects/snastro-wt/sintesi-blocchi/consolidamento/<id> — NEVER in .worktrees/: Konsist 0.17 walks the whole root
# (Konsist.scopeFromProject), which makes the gate run out of memory.
