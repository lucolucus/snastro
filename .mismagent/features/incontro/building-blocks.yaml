releases:
  I1:
    goal: "Foundations of the Incontro, invisible on today's data: every Registrazione is the one Parte of its Incontro (7.sqm), Voci, names, prints and Riassunti are keyed by the Incontro, and the app looks and behaves as today except the two deliberate changes of D-0007 — Voce numbers are never reused, and a Ritrascrivi makes the Riassunto superato instead of redoing it."
    launch: "./gradlew :avvio:run on a migrated project: S2/S3/S4 identical to today; Ritrascrivi a recording that has a Riassunto → the Riassunto shows 'superato' with 'Riassumi di nuovo'"
    blocks: ["persistenza-incontro", "riassunto-incontro-politiche", "incontro-chiavi", "incontro", "voci-dell-incontro", "parlante-impronte-per-parte", "riassunto-incontro", "porte-progetto-incontro", "porte-trascrizione-incontro", "porte-parlanti-incontro", "porte-sbobinatura-incontro", "porte-sintesi-incontro", "aggiungi-registrazione-incontro", "elimina-parte", "esegui-elaborazione-incontro", "revisione-incontro", "eliminazione-parte-trascrizione", "politiche-parlanti-incontro", "attribuzione-incontro", "rigenerazione-sbobinatura-incontro", "riassumi-incontro", "esegui-riassunto-incontro", "eliminazione-parte-sintesi", "catalogo-incontro", "voci-del-trascritto-incontro", "nomi-delle-voci-incontro", "letture-parlanti-incontro", "riassunto-vista-incontro", "adattatori-progetto-incontro", "adattatori-trascrizione-incontro", "adattatori-parlanti-incontro", "adattatori-sbobinatura-incontro", "adattatori-sintesi-incontro", "avvio-incontro"]
  I2:
    goal: "Incontri in più parti: import several files as one Incontro or add Parti later, see Incontri in S2 with their Parti, set the start time, transcribe every Parte with one Numero di persone, open each Parte with the Incontro's Voci and Riassunto, join a person across Parti, delete one Parte — the brief's outcome on a real 2-3 part meeting."
    launch: "S2 → 'Importa file audio…' with 2 files → 'Un incontro in 2 parti' → 'Trascrivi 2 parti' → S3 Parte 1 / Parte 2 → Riassunto tab"
    blocks: ["modifica-ora-di-inizio", "avvia-elaborazioni-incontro", "incontri-del-progetto", "viste-parte-incontro", "schermata-incontri", "dialogo-importa-parti", "dialogo-elimina-parte", "schermata-parte", "pannello-voci-incontro", "scheda-riassunto-incontro", "schermata-parlanti-incontri", "avvio-incontro-parti"]
  I3:
    goal: "The app proposes joining two unnamed Voci of different Parti that sound like the same person (mutual single FORTE), confirmed with one click — never automatic."
    launch: "S3 of Parte 2 of a 2-part Incontro with unnamed Voci → banner 'Voce 5 e Voce 1 (parte 1) sembrano la stessa persona' → Unisci"
    blocks: ["proposta-tra-parti", "banner-proposta-tra-parti", "avvio-proposta-tra-parti"]
  I4:
    goal: "The date and start time of a Parte are read from the same instant in the file (udta/date) at import, so the Parti come out in the right order without editing, and the recording date is no longer wrong after a re-encode (AC-364 corrected)."
    launch: "Import 2 files of the same meeting → S2 shows them ordered by their real start time"
    blocks: ["sonda-ora-di-inizio"]
