# building-blocks.yaml — incontro (AUTHORITATIVE; the worker-composer's only input)
# Generated by build-manifest on 2026-10-01 (DRAFT, before the user's tests_nl / release checkpoint) from features/incontro/tactical-model.md,
# UI/ux-proposal.md, architetture/architecture-overview.md (A-1..A-13), ADRs 0033-0039 (+ the 2026-10-01 amendments of 0007, 0009, 0012,
# 0014, 0018-0024, 0030), architecture.md, code-rules.md, context-map.md, profile.md, decisions.md D-0001..D-0021.
# Worktree: snastro-wt/incontro (branch feature/incontro). Side `app` only → every boundary is in-process (port + in-process
# consumer-driven contract test); no OpenAPI. No scaffold: the project builds (rule 13).
# SPIKES: voci-tra-parti CLOSED (D-0021, ADR 0036) despite the tactical-model header (lines 12-13, stale) — proposta-tra-parti is NOT
# blocked. ora-di-inizio CLOSED 2026-10-01 by ADR 0040 (D-0026): sonda-ora-di-inizio (release I4) reads date AND time from udta/date.
# AC NUMBERING: incontro-local prefix AC-I1.. (never collides with AC-1..636, AC-S1..S180, AC-C1..C94); invariants INV-I1..INV-I19 from
# features/incontro/tactical-model.md, plus the amended INV-n / INV-S n they restate. Test names start with the tag followed by a space
# (`AC-I12 `, `INV-I4 `), JVM-safe (INV_I4 accepted), greppable per block. New items take the next free number; never renumber.
# `(by-construction)` items cannot fail — listed for completeness, NOT counted as coverage. `[@modelli]` items run only opt-in
# (`./gradlew modelliTest` / `benchmarkRiassunto`), outside the gate.
# tests_nl_status: `confirmed` = high_value row whose tests_nl the USER CONFIRMED at the checkpoint (2026-10-01); `draft` otherwise. `high_value: true`
# marks the blocks and boundaries whose tests_nl the user is asked to confirm.
# REUSED boundaries (owners integrated on main, never redeclared): trascrizione-con-parlanti/kernel-pl, eventi-progetto,
# eventi-elaborazione, eventi-revisione, tec-shell-ui; sintesi/agg-riassunto, repo-sintesi. Rows that touch them list them in `reuses:`.
# REWORKS of code owned by trascrizione-con-parlanti and sintesi are blocks of THIS manifest; the sibling manifests are not edited.
# GATE ORDERING (architecture-overview § Gate note): ControlliAdrTest asserts every check script an ADR cites exists. ADR 0034's two
# scripts are written by persistenza-incontro and ADR 0037's by riassunto-incontro-politiche, so BOTH are wave 1 and every other block
# waits for them (wave ≥ 2, owners first). AMENDED 2026-10-01 (user, D-0025): the rule-9 confinement checks (ADR 0033/0035/0037 §9)
# are owned by wave 3–4 blocks, so ControlliAdrTest is RELAXED, as a separate gate commit BEFORE wave 1 (like I0, not a block): a cited
# script that does not exist yet is reported deferred, not failed, while its `from` block has no integrated/<id>.json; once integrated,
# it must exist and discriminate. ready_when for every block: "the D-0025 gate commit is on feature/incontro".
# TRANSITION between wave 1 and wave 2: persistenza-incontro lands 7.sqm under the CURRENT domain types; its repositories resolve the new
# incontro_id keys from registrazione_id by SQL join (valid because, until aggiungi-registrazione-incontro, every Incontro has exactly one
# Parte — the import creates one per file). incontro-chiavi (wave 2) re-keys the kernel and every use, and removes those joins. No code
# relies on «incontro.id = registrazione.id» (ADR 0034 §1): the join reads the column.
# AMENDED 2026-10-01 (user, D-0031; incontro-chiavi BOUNCED, open question answered with option A): the sweep needs an Incontro → Parti
# read before wave 4, so incontro-chiavi now OWNS the minimal unordered reads of ADR 0033 §4.1 — boundaries parti-di-incontro-progetto,
# lettore-incontro-sintesi, parti-per-parlanti, registrazione-incontro-id — and the Riassunto re-key (boundary repo-riassunto-incontro,
# AC-I30 moved here from porte-sintesi-incontro). Wave 4/5 rows porte-sintesi-incontro, porte-parlanti-incontro and catalogo-incontro
# WIDEN those methods instead of adding them. incontro-chiavi's new tests_nl AC-I203..AC-I209 come from the user-accepted option
# (architect's proposal, ADR 0033 §4.1); its tests_nl_status stays confirmed.
# AMENDED 2026-10-02 (user, D-0037) — GENERAL RULE for every remaining block: when a block's pinned shapes break callers owned by later
# blocks, the block itself makes compile-only, behaviour-neutral edits in those callers (any module), as in D-0031/D-0033. Multi-Parte
# contract cases run on the Finta now and on the real adapter behind an explicit environment capability flag switched on when the I2
# multi-file import lands (no skipped/aborted tests: the gate fails tests JUnit does not execute). Workers list such edits as DEVIATIONS.
feature: incontro
profile: .mismagent/profile.md
ac_scheme: "AC-I1..AC-I210 incontro-local (assigned in manifest order 2026-10-01); INV-I1..INV-I19 from features/incontro/tactical-model.md"
blocks:
  # ---------------------------------------------------------------- wave 1: the two owners of the new ADR check scripts
  - id: "persistenza-incontro"
    type: "adapter"
    context: "piattaforma"
    side: "app"
    wave: 1
    release: "I1"
    high_value: true
    module: ":persistenza (migrations/7.sqm, *.sq) + the SQL repositories of :progetto:adattatori, :trascrizione:adattatori, :parlanti:adattatori, :sintesi:adattatori (query renames only) + architettura-test/controlli-adr"
    what: "Write 7.sqm exactly as ADR 0034 §1 (incontro, registrazione.incontro_id + ora_di_inizio + two triggers, voci_incontro, voce_incontro, Parlanti and Sintesi leaves rebuilt, struttura re-encoded) and the matching .sq queries; extend the migration test (ADR 0034 §4); keep every existing repository compiling and behaving the same under the current domain types by resolving incontro_id from registrazione_id in SQL; write ADR 0034's two check scripts with fixtures."
    sources:
      - "ADR 0034 §1-§4"
      - "ADR 0033 §6"
      - "tactical-model.md § Migration"
      - "architecture-overview.md A-5, A-6, Gate note"
    consumes: []
    related_adrs: ["0006", "0007", "0009", "0022", "0034"]
    tests_nl_status: "confirmed"
    tests_nl:
      - "AC-I1 migration test: a pre-feature DB (schema 7: a Registrazione with a revised Trascritto whose prossima_voce exceeds its highest Voce, two Attribuzioni, prints, a pronto and a fallito Riassunto with Fonti) migrates to 8 with integrity_check and foreign_key_check clean"
      - "AC-I2 after migration: exactly one incontro row per registrazione, registrazione.incontro_id set on every row, ora_di_inizio NULL on every row; voci_incontro.prossima_voce equals the old trascritto.prossima_voce; same Voce numbers, same Attribuzioni, every print with registrazione_id = its Registrazione"
      - "INV-I3 every riassunto, elemento and fonte row is preserved, each Fonte carries its registrazione_id, and the struttura is re-encoded as '<registrazioneId>=' + old encoding; the NOT-superato proof (domain predicate on the migrated rows) lives in :sintesi:adattatori RiassuntoMigratoDaV7Test (ADR 0034 Amendment 2026-10-03)"
      - "AC-I3 the triggers refuse an INSERT into registrazione with NULL incontro_id and an UPDATE that changes incontro_id (RAISE ABORT), and accept an UPDATE of other columns"
      - "AC-I4 the rebuilt indexes: a second open Riassunto (in_attesa) for the same incontro_id violates riassunto_non_pronto_unico; a second pronto violates riassunto_pronto_unico; a second impronta for the same (parlante, incontro, voce, registrazione) violates the UNIQUE"
      - "AC-I5 Schema.migrate from empty equals Schema.create; every new or changed query runs once against the migrated DB; PRAGMA foreign_key_list(riassunto_fonte) targets riassunto_elemento (rename rewrite happened)"
      - "AC-I6 behaviour-neutral before incontro-chiavi: the existing repository contract tests (Trascritto, Attribuzione, Parlante, Riassunto, Registrazione) pass unchanged against the migrated schema; a new Registrazione saved by the repository gets its own new incontro row (one Parte) in the same transaction"
      - "AC-I7 after a migration that crossed version 8 the open path runs the WAL checkpoint (TRUNCATE): the old impronta_vocale pages are not left in the -wal file (test on a real file DB)"
      - "AC-I8 adr-0034-schema-incontro.sh exits 0 on the tree and 1 on each violating fixture of ADR 0034 (each clause removed, an index on registrazione_id, the riassunto FK DEFERRABLE, 7.sqm absent); adr-0034-tabelle-incontro-confinate.sh exits 0 on the tree and 1 on each violating fixture, 0 on each conforming one"
    notes: "Owner of ADR 0034's checks (from: persistenza-incontro). The SQL joins that keep today's repositories working are a transition removed by incontro-chiavi (header § TRANSITION). If SQLDelight 2.1 rejects the triggers, say so in the PR: ADR 0034 §2 is amended, never silently."
  - id: "riassunto-incontro-politiche"
    type: "application-service"
    context: "sintesi"
    side: "app"
    wave: 1
    release: "I1"
    high_value: true
    module: ":sintesi:applicazione ..politiche, :sintesi:adattatori ..eventi, :avvio (sintesi wiring), architettura-test/controlli-adr"
    what: "Delete the sostituzione-trascritto Sintesi policy (ApplicaSostituzioneTrascrittoSintesiPolitica), its subscriber AbbonatoTrascrizioneSintesi, their wiring and tests: no automatic Riassumi exists any more, 1-part included. Write ADR 0037's prohibition check with fixtures."
    sources:
      - "ADR 0037 §7 + enforced_by"
      - "tactical-model.md § Sintesi [INV-I12b]"
      - "decisions.md D-0004, D-0007"
    consumes: []
    reuses: ["sintesi/agg-riassunto", "sintesi/repo-sintesi", "trascrizione-con-parlanti/eventi-elaborazione"]
    related_adrs: ["0021", "0037"]
    tests_nl_status: "confirmed"
    tests_nl:
      - "INV-I12b after a completed Ritrascrivi of a Registrazione that has a pronto Riassunto, the Riassunto is still there (same id, same content), no new Riassunto is enqueued, and the queue holds no Riassunto item"
      - "INV-I12b a TrascrittoSostituito published on the in-memory dispatcher reaches no Sintesi subscriber (the composition registers none: assertion on the subscriber list)"
      - "AC-I9 adr-0037-nessun-riassunto-automatico.sh exits 0 on the tree; 1 on each violating fixture (import of TrascrittoSostituito in sintesi/adattatori, an `is TrascrittoSostituito ->` branch in sintesi/applicazione, a fully-qualified use); 0 on the conforming ones (the name in a KDoc and a // comment, TrascrittoEliminato used)"
    notes: "Owner of ADR 0037's check (from: riassunto-incontro-politiche). The RegistrazioneEliminata policy re-scope (delete only when incontroCessato) needs the amended event and is block eliminazione-parte-sintesi (wave 5): split from this block so the check script lands in wave 1 (gate ordering). Until incontro-chiavi lands, a re-transcription leaves a pronto Riassunto that becomes superato by the existing StrutturaTrascritto comparison."
  # ---------------------------------------------------------------- wave 2: the breaking re-key, one sweep
  - id: "incontro-chiavi"
    type: "port"
    context: "piattaforma"
    side: "app"
    wave: 2
    release: "I1"
    high_value: true
    model_hint: "deep"
    after: ["persistenza-incontro", "riassunto-incontro-politiche"]
    module: ":kernel (Published Language) + every use in :progetto, :trascrizione, :parlanti, :sbobinatura, :sintesi, :ui, :avvio (compile sweep)"
    what: "Add IncontroId and SegmentoRef to the kernel and re-key VoceRef to (incontroId, voceId); sweep every use in one compile-checked change: Registrazione/RegistrazioneVista carry incontroId (read from registrazione.incontro_id; a new Incontro id via the GeneratoreId port), Attribuzione and prints keyed by the Incontro VoceRef, Riassunto and its queue item keyed by incontroId, Sbobinatura names by incontroId; the SQL repositories use the incontro_id columns directly and the wave-1 joins go. Where a path must go from an Incontro to its Parti it uses the minimal UNORDERED reads this block owns (ADR 0033 §4.1, D-0031): CatalogoRegistrazioni.parti(incontroId), Sintesi's new LettoreIncontro.parti, Parlanti's LettoreRegistrazione.parti, and RegistrazioneVista.incontroId on each consumer's view; Trascrizione services resolve incontroId through LettoreRegistrazione and pass it to TrascrittoRepository.trova/rimuovi(r, incontroId) (no Trascrizione query reads the registrazione table). Behaviour-neutral: every existing Incontro has one Parte."
    sources:
      - "ADR 0033 §1, §4.1, §6"
      - "ADR 0034 §2 (D-0028: no UPDATE names incontro_id)"
      - "tactical-model.md § Seam granularity"
      - "decisions.md D-0002, D-0023, D-0031"
      - "open-questions/incontro-chiavi.md (answered: option A)"
    consumes: []
    reuses: ["trascrizione-con-parlanti/kernel-pl", "sintesi/repo-sintesi"]
    related_adrs: ["0002", "0021", "0033", "0034"]
    tests_nl_status: "confirmed"
    tests_nl:
      - "AC-I10 kernel: VoceRef(IncontroId('i1'), VoceId(2)) == VoceRef(IncontroId('i1'), VoceId(2)) and != VoceRef(IncontroId('i2'), VoceId(2)); SegmentoRef equality is by (registrazioneId, segmentoId); IncontroId wraps a non-blank String (blank → require failure)"
      - "AC-I11 no symbol named VoceRef carries a registrazioneId any more (compile sweep; Konsist assertion: VoceRef's constructor has exactly the parameters incontroId and voceId)"
      - "AC-I12 behaviour-neutral on a migrated 1-part DB: the existing e2e flows (transcribe, name a Voce, revise, Riassumi, Elimina) produce the same rows and views as before the sweep, keyed by the Registrazione's incontroId (avvio e2e on real SQLite)"
      - "AC-I13 the wave-1 SQL joins are gone: no repository query resolves incontro_id from registrazione_id (grep in the PR + the repository contract tests pass with the incontro_id columns written directly)"
      - "AC-I30 RiassuntoRepositoryContratto: trova by incontroId returns the open or pronto Riassunto of that Incontro only; RiassuntiInAttesa items carry (riassuntoId, incontroId, richiestoAlle)"
      - "AC-I203 CatalogoRegistrazioni.parti(incontroId) (supplier test, :progetto:applicazione) returns exactly the Registrazioni whose incontro_id is that Incontro, in no guaranteed order; null for an unknown IncontroId; null after the only Parte is deleted; never a Registrazione of another Incontro"
      - "AC-I204 LettoreIncontroContratto (Sintesi) on LettoreIncontroFinta and on the real LettoreIncontroDaProgetto: the four cases of AC-I203; no order asserted"
      - "AC-I205 LettoreRegistrazioneContratto (Parlanti) gains the four parti cases of AC-I203; LettoreRegistrazioneContratto (Trascrizione and Parlanti): registrazione(r).incontroId equals the IncontroId set at import"
      - "AC-I206 Parlanti VoceRef → Parti: ConfermaAttribuzione(VoceRef(i, 2)) on a 1-part Incontro extracts the print from that Parte's intervals and stores it with registrazione_id = that Parte; a VoceRef of an unknown Incontro → VoceNonTrovata, nothing written"
      - "AC-I207 Sintesi keyed by incontroId: Riassumi(incontroId) on a 1-part Incontro reads that Parte's segmenti and elaborazioneAperta through LettoreIncontro.parti; EseguiProssimoRiassunto and riassunto-vista give the same rows and view as before the sweep"
      - "AC-I208 Trascrizione resolves incontroId through LettoreRegistrazione: TrascrittoRepository.trova(r, incontroId) reads the counter from voci_incontro; no Trascrizione .sq query references the registrazione table (grep in the PR)"
      - "AC-I209 no repository UPDATE lists incontro_id in its SET (D-0028): the sweep's queries pass the immutability trigger; an attempted UPDATE naming it is refused"
    notes: "The kernel-pl boundary of trascrizione-con-parlanti stays the owner of the other kernel types; this block re-pins VoceRef/IncontroId/SegmentoRef as boundary kernel-incontro. No deprecated symbol survives (ADR 0033 §6): no cleanup node. Owns the minimal UNORDERED Incontro → Parti reads of ADR 0033 §4.1 (D-0031; boundaries parti-di-incontro-progetto, lettore-incontro-sintesi, parti-per-parlanti, registrazione-incontro-id) and the Riassunto re-key (repo-riassunto-incontro): wave-4/5 blocks widen them (ordered, numbered), never add a parallel method. The other new port METHODS (statoParte, partiConTrascritto, incontriCon, Trascrizione's parti) stay in the port blocks of wave 4. Pre-release I1 transition lines (UUID.randomUUID() for the Incontro id, JOIN reads returning one row per Parte) are fixed here where the sweep reaches them."
  # ---------------------------------------------------------------- wave 3: aggregates
  - id: "incontro"
    type: "aggregate"
    context: "progetto"
    side: "app"
    wave: 3
    release: "I1"
    high_value: true
    module: ":progetto:dominio"
    what: "Add the Incontro root (identity + progettoId, nothing else), amend Registrazione with an immutable incontroId and an optional OraDiInizio with modificaOraDiInizio, add the OraDiInizio VO and the pure OrdineDelleParti (the only place the order of the Parti is computed)."
    sources:
      - "ADR 0033 §1"
      - "tactical-model.md § Progetto"
      - "decisions.md D-0008, D-0009, D-0013"
    consumes: ["kernel-incontro"]
    related_adrs: ["0003", "0033"]
    invariants:
      - "INV-I1 every Registrazione is a Parte of exactly one Incontro of the same Progetto; its incontroId is set at creation and never changes (the set half — never empty, created with its first Parte, gone with its last — is tested on aggiungi-registrazione-incontro and elimina-parte)"
      - "INV-I2 the Parti of an Incontro are in the total order (DataRegistrazione, OraDiInizio empty last, aggiuntaAlle, registrazioneId); numero della parte = 1-based rank"
      - "INV-I14 OraDiInizio, when present, is a valid local time of day to the second in [00:00:00, 24:00:00) — a LocalTime with a non-zero fraction of a second is refused (OraDiInizioNonValida; callers truncate first); empty is legal, also after an edit"
    invariant_fields: ["Registrazione.incontroId", "Registrazione.oraDiInizio", "Incontro.progettoId"]
    identity: "IncontroId (kernel) minted by aggiungi-registrazione-incontro via GeneratoreId (UUID v4); migrated Incontri by 7.sqm"
    tables: ["incontro", "registrazione (incontro_id, ora_di_inizio)"]
    tests_nl_status: "confirmed"
    tests_nl:
      - "INV-I1 Registrazione exposes incontroId, no method changes it, and reconstitution with a different incontroId than the stored one is impossible through the API (invariant test: every mutating method keeps incontroId)"
      - "INV-I2 OrdineDelleParti table test: (a) different dates order by date; (b) same date: 09:00 before 10:00; (c) same date, one empty: the timed one first, the empty last; (d) A 09:00 imported 3rd, B empty imported 2nd, C 10:00 imported 1st → A, C, B on every permutation of the input (transitive); (e) full tie → by aggiuntaAlle then registrazioneId; numbers are 1..N"
      - "INV-I14 OraDiInizio.di table test: '00:00:00' and '23:59:59' → Ok; '24:00:00', '12:60:00', '-1', '' as a time → Errore(OraDiInizioNonValida); null → empty (legal); OraDiInizio.di(LocalTime.of(12, 0, 0, 500_000_000)) → Errore(OraDiInizioNonValida)"
      - "AC-I14 modificaOraDiInizio(nuova) returns OraDiInizioModificata(precedente, nuova); the same value (also empty → empty) returns no event; clearing a set time is allowed and returns an event"
      - "AC-I15 Incontro holds only identity and progettoId: title, date, numero della parte and '· N parti' are not fields (by-construction: covered by a Konsist assertion on the class's properties, not counted)"
  - id: "voci-dell-incontro"
    type: "aggregate"
    context: "trascrizione"
    side: "app"
    wave: 3
    release: "I1"
    high_value: true
    model_hint: "deep"
    module: ":trascrizione:dominio"
    what: "Rework the Trascritto root into the VociDellIncontro root (identity IncontroId): the Voce counter plus one Trascritto entity per transcribed Parte; move the Revisione methods to it and add completaParte and rimuoviParte; Voce numbers and segmentoIds are never reused."
    sources:
      - "ADR 0035 §1-§3"
      - "tactical-model.md § Trascrizione"
      - "decisions.md D-0007, D-0011, D-0012"
    consumes: ["kernel-incontro"]
    reuses: ["trascrizione-con-parlanti/kernel-pl"]
    related_adrs: ["0018", "0035"]
    invariants:
      - "INV-6 (scope Incontro) every Segmento belongs to exactly one existing Voce of the Incontro; every Voce has ≥ 1 Segmento in some Parte; a Voce left with none is removed"
      - "INV-8 (scope Incontro) a Revisione conserves the set of Segmenti of the whole Incontro (ids, intervals, text, Parte); only Voce and confermato change; a Segmento never changes Parte"
      - "INV-I4 Voce n is unique in the Incontro and a number, once given, is never given again there"
      - "INV-I5 completaParte changes only that Parte's Segmenti: first transcription adds Segmenti and NEW Voci numbered by first appearance; replacement removes the old Segmenti from their Voci, drops emptied Voci, keeps Voci that speak in other Parti, then adds new Voci; never an automatic join"
      - "INV-I6 rimuoviParte removes the Parte's Segmenti from their Voci, drops emptied Voci, keeps the others with identity and number"
      - "INV-I7 a Revisione relates Voci and Segmenti of ONE Incontro; the Parti may differ"
      - "INV-I16 a segmentoId is never reused within its Registrazione, across Trascritto generations"
    invariant_fields: ["prossimaVoce", "trascritti (per Parte: segmenti, prossimoSegmento)", "voci"]
    identity: "IncontroId (kernel); the Trascritto entities by RegistrazioneId"
    tables: ["voci_incontro", "voce_incontro", "trascritto", "voce", "segmento"]
    tests_nl_status: "confirmed"
    tests_nl:
      - "INV-I5 first completion of Parte A (clusters c1, c2) gives Voce 1, 2; completion of Parte B (clusters c1, c2, c3) adds Voce 3, 4, 5 numbered by first appearance in B; A's Segmenti are untouched; no Voce of B is joined to a Voce of A"
      - "INV-I5 replacement of Parte B: B's old Segmenti leave Voci 3-5; Voci 3-5 (only in B) are removed; a Voce joined across A and B (after unire) keeps its number with A's Segmenti; the new clusters become Voce 6, 7…"
      - "INV-I4 after unire(1, 3), replacement of every Parte and removal of every Parte, the next new Voce takes the counter (never 1, 2 or 3 again); the counter is never decremented"
      - "INV-I16 replacing Parte A whose Segmenti were 1..40 numbers the new Segmenti from 41; a Fonte (A, 12) of the old generation no longer resolves to any Segmento"
      - "INV-6 unire, riassegna, a replacement and rimuoviParte that empty a Voce remove it; no operation leaves a Voce with zero Segmenti or a Segmento on a non-existing Voce (property test over random command sequences)"
      - "INV-8 unisci/dividi/riassegna/riassegnaInBlocco/confermaSegmento across two Parti conserve the multiset of (registrazioneId, segmentoId, interval, text): only voceId and confermato differ"
      - "INV-I6 rimuoviParte(B) with Voce 2 in A and B: Voce 2 survives with only A's Segmenti; Voce 4 (only B) is removed and listed in vociRimosse"
      - "INV-I7 unisci(VoceRef of another Incontro, …) and riassegna(SegmentoRef of a Registrazione that is not a Parte of this root) → Errore(VoceNonTrovata / SegmentoNonTrovato), nothing changes"
      - "AC-I16 dividi of Voce 2 (Segmenti in A and B) with S = its B Segmenti creates one new Voce with the counter; INV-10 (S a proper non-empty subset) is checked over the whole Incontro"
  - id: "parlante-impronte-per-parte"
    type: "aggregate"
    context: "parlanti"
    side: "app"
    wave: 3
    release: "I1"
    high_value: true
    module: ":parlanti:dominio"
    what: "Amend Parlante so its ImprontaVocale are keyed per (VoceRef, Parte): at most one print per (Parlante, VoceRef, registrazioneId), each recording the Parte it was sourced from; add the per-Parte removal and the unire re-keying rules the policies call."
    sources:
      - "ADR 0035 §6"
      - "tactical-model.md § Parlanti [INV-I8], [INV-21]"
      - "ADR 0009 amendment 2026-10-01"
    consumes: ["kernel-incontro"]
    related_adrs: ["0009", "0035"]
    invariants:
      - "INV-I8 an ImprontaVocale is sourced from ONE attributed Voce in ONE Parte and records that Parte; a Parlante holds at most one per (VoceRef, Parte); a print exists only while the Attribuzione points to an attivo Parlante; a print is not required for every Parte of the Voce"
      - "INV-21 (addition) in unire(A, B) on the SAME Parlante, B's prints for Parti where A has none are re-keyed onto A; where both have one, A's is kept and B's dropped; the inheritance case re-keys B's prints keeping their Parte"
    invariant_fields: ["impronte (per VoceRef, Parte)"]
    identity: "ParlanteId (unchanged)"
    tables: ["impronta_vocale (via the Parlanti repository)"]
    tests_nl_status: "confirmed"
    tests_nl:
