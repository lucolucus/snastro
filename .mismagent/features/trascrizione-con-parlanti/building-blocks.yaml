    notes: "AMENDED 2026-09-24 (ADR 0014): view_shape gains numeroPersone (AC-162 rewritten). AMENDED 2026-09-24 (ADR 0018 + Amendment 2026-09-24 (b), manifest delta 2026-09-24-ritrascrivi): view_shape gains trascrittoDisponibile (the S2/S3 'Ritrascrizione …' states and the S3 read-only flag derive from the pair stato + trascrittoDisponibile; no new enum value) and elaborazioneId (for S2 'Annulla'); numVoci follows the Trascritto, not the latest state."
