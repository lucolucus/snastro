release_plan:
  # RELEASE PIVOT 2026-09-23 (user decision). Every block carries `release:` = the minimal release that needs it.
  # A release is the set of blocks with release <= it; build_order/waves stay the dependency order inside it.
  R0: {name: "Archivio", scope: "native window; create/open a project (folder naming AC-263/264); import recordings (audio copied, titolo unique); list them (S2) and play them; real SQLite + real audio; NO ML, NO Trascrizione, NO Parlanti", composition_root: "avvio-r0"}
  R1: {name: "Trascrizione", scope: "start a transcription; pipeline VAD/ASR/diarization/alignment with real ML adapters; S3 with 'Voce n'; Revisione; Documento .md", composition_root: "avvio-composizione", gated_by: ["ADR closing spike scelta-asr-code-switching", "ADR closing spike scelta-diarizzatore", "ADR closing spike allineamento-parole-voci", "ADR closing spike packaging-modelli-desktop", "ADR closing spike attesa-mutex-estrazione"]}
  R2: {name: "Parlanti", scope: "attribution, S4 speakers screen, voice prints, proposals, re-alignment", composition_root: "avvio-parlanti", status: "PAUSED"}
