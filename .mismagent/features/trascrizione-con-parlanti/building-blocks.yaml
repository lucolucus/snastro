      - "AC-270 ParlanteRepositoryContratto: aggiornaImpronta aggiorna la riga solo se esiste ancora con sorgente e modello uguali a quelli attesi (true); riga assente o sorgente/modello cambiati → false e nulla è scritto; non inserisce mai una riga (conteggio invariato)"
      - "AC-271 ParlanteRepositoryContratto: impronteDiRegistrazione e impronteDelProgetto restituiscono tutte e sole le RigaImpronta (parlanteId, voceRef, sorgente, modello) della Registrazione / del Progetto; il round-trip di un Parlante conserva sorgente e modello di ogni impronta"
      - "AC-272 EstrattoreImprontaFinta e DecodificatoreAudioFinta lanciano IllegalStateException se invocate mentre la UnitaDiLavoroFinta passata ha transazioneAperta = true; fuori dalla transazione rispondono normalmente"
      - "AC-273 EstrattoreImprontaContratto: modello è non vuoto e costante per l'istanza"
      - "AC-495 (ADR 0019) The ClassificatoreSomiglianza port, Classificazione, SoglieSomiglianza, ClassificatoreSomiglianzaFinta and the abstract ClassificatoreSomiglianzaContratto exist as pinned in tec-classificatore-somiglianza; ErroreParlanti.RiferimentiInsufficienti(registrazioneId) is added (ErroriParlanti.kt); :ui MessaggiErrore needs no text for it (the button is disabled before it can happen; the glue maps it to the generic message)"
    notes: "AMENDED 2026-09-23 (ADR 0012 Amendment (b)): EstrattoreImpronta.modello; ParlanteRepository compare-and-set aggiornaImpronta + impronteDiRegistrazione / impronteDelProgetto (RigaImpronta); ML Finte guard against an open transaction. FOLLOW-UP REQUIRED: merged before ADR 0012 Amendment (b); the merged code does not yet satisfy the amended criteria above — a rework/fix block must land them. AMENDED 2026-09-24 (ADR 0019 + Amendment 2026-09-24 (b), manifest delta 2026-09-24-semi-automatica): owns the new boundary tec-classificatore-somiglianza (AC-495) and ErroreParlanti.RiferimentiInsufficienti. LettoreVoci.segmenti (AC-494) belongs to porta-lettore-voci, the owner of voci-per-parlanti (reconciled at fold)."
    sources: "features/trascrizione-con-parlanti/architetture/architecture-overview.md (Technical ports), ADR 0004/0009"
