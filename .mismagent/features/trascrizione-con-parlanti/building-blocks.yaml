      - "0005"
      - "0010"
      - "0012"
      - "0014"
    commands:
      - "AggiungiRegistrazione"
      - "ModificaDataRegistrazione"
    tests_nl:
      - "AC-56 AggiungiRegistrazione con un file leggibile crea la Registrazione con titolo = nome del file senza estensione, durata dalla sonda e DataRegistrazione = data del file, e pubblica RegistrazioneAggiunta"
      - "AC-57 Un file illeggibile o in formato non supportato → errore, nessuna Registrazione creata e nessun file lasciato in audio/"
      - "AC-58 Una copia fallita a metà → nulla creato (nessuna riga, nessun file parziale)"
      - "AC-59 L'audio è copiato in audio/<registrazioneId>.<ext> e il riferimento salvato è relativo alla cartella del progetto"
      - "AC-60 Se un abbonato sincrono a RegistrazioneAggiunta restituisce Errore o lancia, la Registrazione non esiste e nessun file resta in audio/ (rollback dell'intero comando) — test con un abbonato sincrono finto; nessuna composizione ne registra uno (nessun avvio automatico, ADR 0014), il meccanismo resta (ADR 0012) — REWRITTEN 2026-09-24"
      - "AC-61 Aggiungere due volte lo stesso file crea due Registrazioni distinte, senza blocchi; la seconda riceve il titolo '<nome> (2)' (AC-322)"
      - "AC-62 ModificaDataRegistrazione sostituisce la data e pubblica DataRegistrazioneModificata(precedente, nuova)"
      - "AC-63 ModificaDataRegistrazione su una Registrazione inesistente → RegistrazioneNonTrovata"
      - "AC-322 AggiungiRegistrazione assegna un titolo UNICO nel Progetto: base = nome del file senza estensione (NFC, trim; vuoto → 'registrazione'); se chiave(base) coincide con chiave(t) di un titolo t di un'altra Registrazione dello stesso Progetto (titoliDelProgetto), prova 'base (2)', 'base (3)'… e assegna il primo libero; chiave(t) = pulisci(t) (la regola di nomeFile, vedi tec-scrittore-documento) in minuscolo con Locale.ROOT. Es.: esiste 'Riunione' → 'riunione.m4a' diventa 'riunione (2)'; esistono 'Riunione' e 'Riunione (2)' → 'Riunione (3)'; esiste 'Riunione*' → 'Riunione?' diventa 'Riunione? (2)' (stessa chiave 'riunione_')"
      - "AC-323 Il titolo è deterministico e stabile: stessi titoli esistenti + stesso file → stesso titolo; una volta assegnato non cambia mai (ModificaDataRegistrazione non lo tocca); i titoli di Registrazioni di un ALTRO Progetto non contano (test con RegistrazioneRepositoryFinta che contiene 'Riunione' di un altro progettoId → il nuovo titolo resta 'Riunione')"
      - "AC-324 Nomi lunghi: prima di aggiungere ' (n)' la base è troncata (su un confine di code point, poi rimossi spazi/punti finali) a 237 byte UTF-8 meno la lunghezza del suffisso, così il suffisso sopravvive sempre a pulisci e la ricerca termina: con un titolo esistente di 250 byte e un nuovo file con gli stessi primi 237 byte il nuovo titolo è '<primi 233 byte> (2)' e le due chiavi differiscono"
    notes: "AMENDED 2026-09-23 (user decision, documento file-name collisions): titolo UNIQUE per Progetto (AC-322..324) via the new RegistrazioneRepository.titoliDelProgetto (repo-progetto). Uniqueness holds BY CONSTRUCTION, no DB index: the read of titoliDelProgetto and the insert run in the same UnitaDiLavoro transaction, and a project has one writer process (ADR 0010 .lock); the key lives in Kotlin (pulisci + Locale.ROOT lowercase), not in SQL (SQLite lower() is ASCII-only). pulisci = the rule pinned in tec-scrittore-documento keys.nomeFile, implemented here as a private pure function of :progetto:applicazione with the same table rows as documento AC-320 (Progetto may not depend on Documento). FOLLOW-UP REQUIRED: merged before this amendment; the merged code does not yet satisfy AC-61 (amended) and AC-322..324 — a rework/fix block must land them (after porte-progetto's follow-up adds titoliDelProgetto)."
    sources: "features/trascrizione-con-parlanti/tactical-model.md § Progetto (+ R2, R6, R24), ADR 0010"
  - id: "avvia-elaborazione"
    type: "application-service"
    context: "trascrizione"
    side: "app"
    wave: 4
    release: "R1"
    module: ":trascrizione:applicazione (..comandi)"
    title: "AvviaElaborazione (accodamento, riprova e ritrascrizione)"
    consumes:
      - "kernel-pl"
      - "agg-elaborazione"
      - "repo-trascrizione"
      - "registrazione-per-trascrizione"
    depends_on: []
    related_adrs:
      - "0004"
      - "0007"
      - "0012"
      - "0014"
      - "0018"
    commands:
      - "AvviaElaborazione"
    invariants:
      - "INV-4 (REWRITTEN 2026-09-24, ADR 0018) per Registrazione at most one Elaborazione in_attesa|in_corso; a new one iff none is open (after none, fallita, or completata = Ritrascrivi); several completata allowed (history)"
    tests_nl:
      - "AC-64 AvviaElaborazione su una Registrazione senza Elaborazioni crea un'Elaborazione in_attesa"
      - "INV-4 con un'Elaborazione in_attesa o in_corso già presente → ElaborazioneGiaAperta e nessuna riga nuova"
      - "AC-65 Dopo una fallita → nuova Elaborazione in_attesa; la fallita resta nello storico"
      - "AC-66 Se il repository segnala la violazione dell'indice, il servizio restituisce lo stesso ErroreDominio (mai un'eccezione grezza)"
      - "AC-67 Registrazione inesistente → RegistrazioneNonTrovata"
      - "AC-369 (ex AC-NP3) AvviaElaborazione con numeroPersone assente → Elaborazione in_attesa senza numero; con 4 → in_attesa con numeroPersone 4; con 0 o 11 → Errore(NumeroPersoneFuoriIntervallo) e nessuna riga nuova; la riprova dopo una fallita salva il valore inviato (la fallita resta invariata)"
      - "AC-434 (Ritrascrivi) After a completata, AvviaElaborazione(r, 3) creates a new in_attesa with numeroPersone 3; the completata row is unchanged (same state, same numeroPersone), and so is the Trascritto: same Voci, Segmenti and counters, and no TrascrittoRepository.salva call (counting fake)"
      - "AC-435 With completata + in_attesa (a Ritrascrizione queued), or with completata + in_corso, another AvviaElaborazione → Errore(ElaborazioneGiaAperta), and no new row"
      - "AC-436 History: completata, then a fallita re-run, then AvviaElaborazione → Ok (3 rows, the first two unchanged); completata, completata, then AvviaElaborazione → Ok; NumeroPersoneFuoriIntervallo still wins before any write (AC-369)"
    notes: "AMENDED 2026-09-24 (ADR 0014, ADR 0012 Amendment (c)): signature AvviaElaborazione(registrazioneId, numeroPersone: Int? = null); the ONLY actor is the utente ('Trascrivi' on NON_AVVIATA, 'Riprova' on fallita) — no subscriber calls it (Q-6 superseded); numeroPersone is validated via NumeroPersone.di BEFORE any write. AMENDED 2026-09-24 (ADR 0018 + Amendment 2026-09-24 (b), manifest delta 2026-09-24-ritrascrivi): the only pre-check is 'any open → ElaborazioneGiaAperta'; actors add 'Ritrascrivi' on a completata row (prefilled with the latest numeroPersone). AvviaElaborazione never touches the Trascritto."
    sources: "features/trascrizione-con-parlanti/tactical-model.md § Trascrizione (INV-4, Q-6 superseded by Amendment 2026-09-23 (c)), ADR 0007, ADR 0014"
  - id: "annulla-elaborazione"
    type: "application-service"
    context: "trascrizione"
    side: "app"
    wave: 4
    release: "R1"
    module: ":trascrizione:applicazione (..comandi)"
    title: "AnnullaElaborazione (ritiro di un'Elaborazione in coda)"
    consumes:
      - "kernel-pl"
      - "agg-elaborazione"
      - "repo-trascrizione"
      - "eventi-elaborazione"
    depends_on: []
    related_adrs:
      - "0004"
      - "0007"
      - "0012"
      - "0018"
    commands:
      - "AnnullaElaborazione"
    tests_nl:
      - "AC-464 First transcription cancelled: with a single in_attesa for r, AnnullaElaborazione(id) → Ok; diRegistrazione(r) is empty; exactly one ElaborazioneAnnullata(r) is published (recording dispatcher fake), inside the transaction (one inTransazione)"
      - "AC-465 Queued re-run cancelled: with completata + in_attesa for r → Ok; only the completata is left, unchanged (same state and numeroPersone); TrascrittoRepository is never called (counting fake: no trova, no salva). A queued 'Riprova' (fallita + in_attesa) → Ok, the fallita stays"
      - "AC-466 Rejections, nothing written and nothing published: the id is in_corso, completata or fallita → Errore(ElaborazioneGiaAvviata(id)); unknown id → Errore(ElaborazioneNonTrovata(id))"
      - "AC-467 Race with the dispatcher: the repository fake answers rimuoviInAttesa with Errore(ElaborazioneGiaAvviata) (the claim won between trova and the delete) → the service returns that error unchanged, publishes nothing, and the transaction rolls back"
      - "AC-468 After a cancellation, AvviaElaborazione(r, n) is accepted again (INV-4: none open) and creates a new in_attesa"
    notes: "NEW 2026-09-24 (ADR 0018 Amendment 2026-09-24 (b) §3, user decision): AnnullaElaborazioneServizio(uow, elaborazioni: ElaborazioneRepository, eventi: DispatcherEventi).esegui(AnnullaElaborazione(elaborazioneId: ElaborazioneId)): Esito<Unit>, ONE transaction: trova → Elaborazione.annulla() → rimuoviInAttesa (compare-and-delete) → publish ElaborazioneAnnullata(registrazioneId). Actor: utente, S2 'Annulla' on a queued row. Only in_attesa (never started) can be cancelled; in_corso cannot (explicit). The never-started row is DELETED: INV-3 unchanged, the Registrazione returns to the state of its remaining latest Elaborazione (NON_AVVIATA / COMPLETATA with the old Trascritto / FALLITA). The race with the dispatcher is serialized by BEGIN IMMEDIATE (fix-batch-17): the loser gets ElaborazioneGiaAvviata. Never reads or writes the Trascritto; no signal to CodaElaborazioni. Release R1 (first transcriptions are R1)."
    sources: "ADR 0018 Amendment 2026-09-24 (b) §3, features/trascrizione-con-parlanti/tactical-model.md § Trascrizione (Amendment 2026-09-24 (b)), ADR 0004/0007/0012"
  - id: "esegui-elaborazione"
    type: "application-service"
    context: "trascrizione"
    side: "app"
    wave: 4
    release: "R1"
    module: ":trascrizione:applicazione (..comandi)"
    title: "EseguiProssimaElaborazione + RecuperaElaborazioniInterrotte (pipeline)"
    consumes:
      - "kernel-pl"
      - "agg-elaborazione"
      - "agg-trascritto"
      - "repo-trascrizione"
      - "registrazione-per-trascrizione"
      - "eventi-elaborazione"
      - "tec-decodifica-trascrizione"
      - "tec-diarizzatore"
      - "tec-allineatore"
      - "tec-segnalatore-fase"
    depends_on: []
    related_adrs:
      - "0003"
      - "0004"
      - "0011"
      - "0012"
      - "0014"
      - "0015"
      - "0018"
    commands:
      - "EseguiProssimaElaborazione"
      - "RecuperaElaborazioniInterrotte"
    invariants:
      - "INV-5 (REWORDED 2026-09-24, ADR 0018) a Trascritto exists iff the Registrazione has ≥ 1 completata; written (created or REPLACED whole) atomically with EACH transition to completata; never touched by any other outcome"
    tests_nl:
      - "AC-68 Parte sempre l'Elaborazione in_attesa più vecchia (FIFO); senza in_attesa → Ok senza effetti"
      - "AC-69 Le fasi sono segnalate in ordine: decodifica, diarizzazione, trascrizione, allineamento"
      - "INV-5 in caso di successo completata e Trascritto sono salvati nella stessa transazione; se il salvataggio del Trascritto fallisce l'Elaborazione non risulta completata e nessun Trascritto esiste"
      - "AC-70 Un errore di qualunque porta in qualunque fase → fallita con un motivo in parole semplici e nessun Trascritto"
      - "AC-71 Le Voci del Trascritto sono numerate per prima apparizione"
      - "AC-72 Zero parlato o zero turni → fallita con motivo 'nessun parlato rilevato'"
      - "AC-73 Nessuna transazione è aperta mentre le porte ML/audio lavorano (verifica di interazione)"
      - "AC-74 RecuperaElaborazioniInterrotte: un'in_corso senza esecuzione viva diventa fallita 'interrotta' ed è riprovabile"
      - "AC-75 RecuperaElaborazioniInterrotte non tocca le Elaborazioni in_attesa, completata o fallita"
      - "AC-370 (ex AC-NP4) La pipeline passa a Diarizzatore.diarizza esattamente il numeroPersone dell'Elaborazione eseguita (assente → assente), anche per un'Elaborazione riletta dal repository dopo un riavvio (DiarizzatoreFinta che registra l'argomento)"
      - "AC-386 (estende AC-72, ADR 0015 regola 7) Se l'Allineatore restituisce una lista vuota (ogni turno scartato perché corto o senza testo) l'Elaborazione diventa fallita con motivo 'nessun parlato rilevato' e nessun Trascritto esiste (AllineatoreFinto che restituisce emptyList)"
      - "AC-387 (INV-7, ADR 0015 regola 9) SegmentoGrezzo sovrapposti di Voci diverse arrivano TUTTI nel Trascritto: nessuno è tagliato, unito o scartato dalla pipeline (AllineatoreFinto con due segmenti sovrapposti di voceIndice diversi → due Segmenti con gli stessi intervalli)"
      - "AC-437 A first completion (no Trascritto before) publishes ElaborazioneCompletata and never TrascrittoSostituito (recording dispatcher fake)"
      - "AC-438 Completion over an existing Trascritto, in ONE transaction (fake UnitaDiLavoro records a single inTransazione): the Elaborazione becomes completata; the Trascritto is replaced whole by the new one (Voci numbered from 1 by first appearance, AC-71; counters from the new Trascritto.crea; no Voce or Segmento of the old one left); TrascrittoSostituito(r) is published strictly BEFORE ElaborazioneCompletata(r); the earlier completata row stays completata"
      - "AC-439 The old Trascritto stays readable until then: while the pipeline is inside Diarizzatore.diarizza (fake blocked on a latch), TrascrittoRepository.trova(r) returns the old Voci and Segmenti unchanged, and no transaction is open (AC-73)"
      - "AC-440 A re-run ending fallita publishes no TrascrittoSostituito, the old Trascritto is unchanged (equal before and after) and the previous completata stays completata — for each of: a fault in any phase; 'nessun parlato rilevato' (AC-72/AC-386); Trascritto.crea refusing its input; RecuperaElaborazioniInterrotte → 'interrotta'"
      - "AC-441 A synchronous subscriber that answers TrascrittoSostituito with Esito.Errore rolls back the whole completion: the old Trascritto is intact, no ElaborazioneCompletata reaches after-commit subscribers, and the compensation marks the run fallita with 'salvataggio del risultato non riuscito' (existing F2 path)"
      - "AC-469 An in_attesa removed by rimuoviInAttesa (AnnullaElaborazione) before EseguiProssimaElaborazione is never started: the next oldest in_attesa starts instead, or, if none is left, Ok without effects (AC-68); the pipeline fakes are not invoked for the removed id"
    notes: "The ADR 0011 NFR AC lives on benchmark-elaborazione (R17), not here. AMENDED 2026-09-24 (ADR 0014): diarizza(campioni, elaborazione.numeroPersone). AMENDED 2026-09-24 (ADR 0015): the Allineatore may legitimately return an empty list (rules 2/7) → the pipeline fails with 'nessun parlato rilevato' (AC-386); overlapping SegmentoGrezzo of different voices pass through untouched (AC-387). AMENDED 2026-09-24 (ADR 0018 + Amendment 2026-09-24 (b), manifest delta 2026-09-24-ritrascrivi): the completion transaction re-reads the existing Trascritto inside it and, if one exists, replaces it whole via TrascrittoRepository.salva and publishes TrascrittoSostituito BEFORE ElaborazioneCompletata (its synchronous Parlanti subscriber purges before COMMIT); the MOTIVO_ELABORAZIONE_GIA_COMPLETATA branch goes with the ErroreTrascrizione sweep (owned by elaborazione). The claim keeps reading the head inside its transaction (AC-314), which is what makes AnnullaElaborazione safe (AC-469)."
    sources: "features/trascrizione-con-parlanti/tactical-model.md § Trascrizione (INV-5, startup policy), ADR 0004/0012, architecture.md § Pipeline"
