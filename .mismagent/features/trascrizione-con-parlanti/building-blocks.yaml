  - id: "conferma-attribuzione"
    type: "application-service"
    context: "parlanti"
    side: "app"
    wave: 4
    module: ":parlanti:applicazione (..comandi)"
    title: "ConfermaAttribuzione"
    consumes:
      - "kernel-pl"
      - "agg-parlante"
      - "agg-attribuzione"
      - "repo-parlanti"
      - "registrazione-per-parlanti"
      - "voci-per-parlanti"
