  - id: "revisione-policy"
    type: "application-service"
    context: "parlanti"
    side: "app"
    wave: 4
    module: ":parlanti:applicazione (..politiche)"
    title: "Policy di Revisione dei Parlanti"
    consumes:
      - "kernel-pl"
      - "agg-parlante"
      - "agg-attribuzione"
      - "repo-parlanti"
      - "voci-per-parlanti"
      - "eventi-revisione"
    depends_on: []
    related_adrs:
      - "0009"
      - "0012"
    commands:
      - "ApplicaRevisione"
    invariants:
      - "INV-21 after a Revisione (STRUCTURAL part only, inside the Revisione's transaction — ADR 0012 Amendment (b) point 3): a removed Voce loses Attribuzione + derived print; a surviving/changed attributed Voce KEEPS its print row in the Revisione's transaction (possibly stale) and is re-derived AFTER commit by RiallineaImpronte; a NEW Voce starts without Attribuzione; in unire(A,B) with different Parlanti A's Attribuzione wins (B's Attribuzione and row go); same Parlante → A keeps its own row (stale), B's row and Attribuzione go; EXCEPTION (user decision 2026-09-23): in unire(A,B) with B attributed to P and A unattributed, A INHERITS the Attribuzione to P — B's Attribuzione is re-keyed to A (Attribuzione.trasferisci) and B's row of P is re-keyed to A in-transaction (Parlante.trasferisciImpronta, keeping its sorgente, so stale) and refreshed after commit; if P is eliminato only the tombstone Attribuzione is re-keyed, no row (policy-only exception to INV-13/INV-17) — so P is not left without Attribuzioni and INV-25 does not fire. The policy NEVER decodes nor extracts (ADR 0012 enforced_by)"
      - "INV-25 a Parlante left without Attribuzioni: occasionale ceases to exist; ricorrente is kept"
    tests_nl:
      - "INV-21 unire(A, B) con A e B attribuiti a Parlanti diversi → vince A; l'Attribuzione di B e l'impronta derivata da B sono cancellate"
      - "INV-21 unire con A attribuita e B no → A mantiene la sua riga d'impronta (ora obsoleta: la sorgente non corrisponde più), nessuna estrazione nella transazione; RiallineaImpronte la aggiorna dopo il commit"
      - "INV-21 unire(A, B) con B attribuita a P attivo e A non attribuita → l'Attribuzione di B è ri-chiavata su A (Attribuzione(A) = P, nessuna Attribuzione per B) e la riga d'impronta di P per B è ri-chiavata su A conservando la sua sorgente_impronta (quindi obsoleta), aggiornata dopo il commit da RiallineaImpronte; P occasionale NON cessa (INV-25 non scatta)"
      - "INV-21 idem con P eliminato → solo l'Attribuzione (tombstone) è ri-chiavata su A; nessuna riga d'impronta è creata (P resta a zero impronte, INV-13)"
      - "INV-21 unire(A, B) con A e B attribuiti allo stesso Parlante P → A mantiene l'Attribuzione a P e la propria riga (obsoleta, aggiornata dopo il commit); l'Attribuzione e la riga di B sono cancellate; P non cessa"
      - "INV-21 dividere(A, S) → A' nasce senza Attribuzione; A mantiene l'Attribuzione e la propria riga d'impronta (obsoleta, aggiornata dopo il commit)"
      - "INV-21 riassegnare → la sorgente svuotata perde Attribuzione e impronta; una destinazione nuova nasce senza Attribuzione"
      - "INV-25 un occasionale rimasto senza Attribuzioni cessa; un ricorrente resta"
      - "AC-96 Un errore della policy (es. il repository della Finta fallisce) restituisce Errore e annulla anche la Revisione"
      - "AC-291 La policy non decodifica né estrae: nessun riferimento a EstrattoreImpronta, DecodificatoreAudio, CampioniAudio o Impronta nel package politiche (enforced_by di ADR 0012 verde) e nessuna riga d'impronta è creata o ri-estratta dalla policy (le Finte ML non sono nemmeno collegate)"
    notes: "AMENDED 2026-09-23 (ADR 0012 Amendment (b) points 3-4, user option (c)): structural part only; print freshness moved to riallinea-impronte (after commit, abbonato-riallineamento-impronte). ADR 0012 enforced_by (no EstrattoreImpronta/DecodificatoreAudio/CampioniAudio/Impronta under politiche/) is red on the in-flight branch (c2f1b72/af0540d import them) BY DESIGN — green once this rework lands. Uses Attribuzione.trasferisci + Parlante.trasferisciImpronta (follow-ups of attribuzione/parlante) for the inheritance."
    model_hint: "deep"
    sources: "features/trascrizione-con-parlanti/tactical-model.md § Parlanti (INV-21, INV-25, Q-2, Q-3), ADR 0012"
  - id: "riallinea-impronte"
    type: "application-service"
    context: "parlanti"
    side: "app"
    wave: 4
    module: ":parlanti:applicazione (..comandi)"
    title: "RiallineaImpronte / RiallineaTutteLeImpronte — freschezza delle impronte dopo il commit"
    consumes:
      - "kernel-pl"
      - "agg-parlante"
      - "repo-parlanti"
      - "voci-per-parlanti"
      - "tec-decodifica-parlanti"
      - "tec-estrattore-impronta"
      - "sorgente-impronta-pl"
      - "eventi-parlanti"
    depends_on: []
    related_adrs:
      - "0003"
      - "0009"
      - "0012"
    model_hint: "deep"
    commands:
      - "RiallineaImpronte"
      - "RiallineaTutteLeImpronte"
    invariants:
      - "INV-15 (freshness half, ADR 0012 Amendment (b)): a row is stale iff sorgente_impronta != SorgenteImpronta.di(current intervals of its Voce).chiave OR modello_impronta != EstrattoreImpronta.modello; only stale rows are re-derived, by compare-and-set UPDATE — existence is never changed here (never INSERT, so a purged print is never resurrected)"
    tests_nl:
      - "AC-292 RiallineaImpronte(registrazioneId) tocca solo le righe obsolete: con tre righe — fresca, sorgente cambiata, modello diverso — solo le ultime due sono decodificate, estratte e aggiornate; quella fresca non è nemmeno decodificata"
      - "AC-293 La scrittura è un aggiornamento compare-and-set (aggiornaImpronta) in una transazione breve per Voce che rilegge la Voce; non avviene mai un inserimento (conteggio righe invariato)"
      - "AC-294 Una riga cancellata tra l'estrazione e la scrittura (EliminaParlante, Attribuzione cambiata, INV-25) non è resuscitata: nessuna riga creata, esito Ok"
      - "AC-295 Se la Voce cambia di nuovo durante l'estrazione (la sorgente ricalcolata nella transazione differisce da quella estratta) non scrive nulla per quella riga; una seconda esecuzione converge"
      - "AC-296 Idempotente: una seconda esecuzione subito dopo non decodifica, non estrae, non scrive nulla e non pubblica ImpronteRiallineate"
      - "AC-297 Nessuna transazione è aperta durante decodifica ed estrazione (le Finte ML lanciano se transazioneAperta)"
      - "AC-298 Pubblica ImpronteRiallineate(registrazioneId) dopo il commit solo se almeno una riga è stata aggiornata"
      - "AC-299 Una riga la cui Voce non esiste più (o Registrazione senza Trascritto) è saltata senza errore e senza scritture (la rimozione spetta alla revisione-policy)"
      - "AC-300 RiallineaTutteLeImpronte(progettoId) esegue RiallineaImpronte per ogni Registrazione con almeno una riga d'impronta del Progetto (impronteDelProgetto); un fallimento su una Registrazione non impedisce le altre ed è riportato"
      - "AC-301 Un'eccezione di decodifica o estrazione si propaga (ADR 0003, così l'abbonato riprova) dopo che le Voci già riallineate sono state committate; per la Voce fallita nulla è scritto"
    notes: "ADR 0012 Amendment (b) point 3: run after commit by abbonato-riallineamento-impronte (coalesced per registrazioneId, retried) and at project open by avvio-composizione (RiallineaTutteLeImpronte, background, after RecuperaElaborazioniInterrotte). Staleness decided with the domain rule ImprontaVocale.obsoleta (never re-coded). An extracted Impronta that is not written is simply dropped (ADR 0009 Amendment (b)). Rows per Voce: at most one per Voce in practice (one Attribuzione per Voce), grouped per Voce anyway."
    sources: "ADR 0012 Amendment (b) points 2-3, ADR 0009 Amendment (b), features/trascrizione-con-parlanti/tactical-model.md § Parlanti (INV-15, INV-21, Commands RiallineaImpronte)"
