    triggers:
      - "ConfermaAttribuzione"
      - "SaltaVoce"
      - "UnisciVoci"
      - "DividiVoce"
      - "RiassegnaSegmento"
      - "ConfermaSegmento"
      - "RiassegnaSegmenti"
    gated_by:
      - "ADR closing spike attesa-mutex-estrazione — satisfied: ADR 0017 (accepted 2026-09-24)"
    tests_nl:
      - "AC-209 La selezione è limitata a una Voce"
      - "AC-210 'Dividi voce' disabilitato con spiegazione se la selezione è l'intera Voce"
      - "AC-211 Riassegna verso una Voce esistente o 'nuova voce'"
      - "AC-212 Galleria vuota → solo 'nuovo…' / 'salta' con il suggerimento 'Prima registrazione: dai un nome alle voci'"
      - "AC-213 Tutti i Candidati 'nessuna' → lista mostrata e 'nuovo…' evidenziato"
      - "AC-214 Fascia come barra, mai un numero"
      - "AC-215 Errore di comando (es. nome già usato) → messaggio inline sulla card e nulla cambia"
      - "AC-216 Banner di proposta di unione: un click unisce e il banner scompare quando la condizione cade"
      - "AC-219 Una Voce attribuita mostra 'cambia' e non 'salta'"
      - "AC-318 Errore VoceCambiata su 'conferma' o 'salta' → messaggio in linguaggio semplice sulla card ('La voce è cambiata nel frattempo: riprova'), nulla cambia e il comando può essere ripetuto"
      - "AC-319 Dopo ImpronteRiallineate della Registrazione aperta la Proposta visibile è ricaricata senza perdere la selezione"
      - "AC-403 (ex metà estratti di AC-217) Audio sorgente mancante → i '▶ estratto' delle Voci e dei Candidati sono disabilitati con messaggio; il pannello resta utilizzabile per conferma/salta/nuovo"
      - "AC-404 (ex metà Revisione di AC-215) Un errore di un comando di Revisione (UnisciVoci, DividiVoce, RiassegnaSegmento → Esito.Errore) è mostrato come messaggio in linguaggio semplice inline nel trascritto; il trascritto e la selezione restano invariati"
      - "AC-405 (stati del pannello) Con le sorgenti Parlanti fornite (R2) ma non ancora caricate il pannello mostra un indicatore di caricamento per card, mai un conteggio provvisorio né una galleria vuota; un errore di lettura di una sorgente mostra un messaggio nella card interessata e lascia il trascritto (AC-402) utilizzabile; le etichette mostrano il Nome attribuito (identificazione-voci) al posto di 'Voce n'"
      - "AC-411 (ADR 0017 §3) 'Conferma' / 'altri ▾ → Conferma' / 'nuovo…' / 'salta' / 'cambia' mettono subito la card nello stato in corso: i pulsanti d'azione della card sono disabilitati (nessun secondo comando dalla stessa card), è mostrato un indicatore di avanzamento, le altre card e il trascritto restano utilizzabili"
      - "AC-412 (ADR 0017 §3) Un comando ancora in corso dopo SOGLIA_ATTESA_VISIBILE_MS (2000 ms, costante definita una sola volta nel presenter di S3) fa mostrare alla card 'In attesa dell'elaborazione…' con un pulsante 'Annulla'; nessuna percentuale, nessun conto alla rovescia — test con un comando finto trattenuto da un latch e tempo virtuale"
      - "AC-413 'Annulla' annulla il comando in corso: la card torna allo stato precedente (stessa Proposta, pulsanti abilitati), nessun messaggio d'errore, e il comando finto vede l'annullamento (nulla è scritto dalla sua parte)"
      - "AC-414 L'esito di un comando in corso è mostrato come quello di ogni comando: il Nome attribuito, l'errore inline di AC-215 o VoceCambiata di AC-318; la barra della Revisione non è disabilitata mentre un comando è in corso"
      - "AC-415 Lo stato in corso viene dalla sorgente per progetto fornita da avvio-parlanti (per VoceRef): un presenter ricreato mentre un comando è ancora in corso (l'utente è uscito da S3 ed è tornato) mostra di nuovo quella card in corso, o in attesa oltre la soglia"
      - "AC-416 Una Proposta non ancora arrivata dopo SOGLIA_ATTESA_VISIBILE_MS fa mostrare alla card 'Proposta in attesa dell'elaborazione…' al posto dei Candidati, senza 'Annulla'; 'altri ▾', 'nuovo…' e 'salta' restano abilitati durante l'attesa"
      - "AC-417 Il presenter non esegue mai un comando né una Proposta sul thread UI: il comando finto registra il suo thread e verifica che non sia il dispatcher UI né quello main del test; è eseguito tramite il dispatcher di background iniettato"
      - "AC-454 (Amendment 2026-09-24 (b): S3 read-only, user) While S3 is read-only (AC-452) the banner adds 'Le correzioni e i nomi assegnati andranno persi.' and every editing action of the panel is disabled: 'Conferma', 'altri ▾', 'nuovo…', 'cambia', 'salta', 'Unisci con ▾', the merge banner's action, the selection toolbar's 'Dividi voce' and 'Riassegna a ▾'; no command is invoked (the command fakes record zero calls) and no Proposta job is started; '▶ estratto' and Segmento playback still work — presenter test with the stati source at IN_ATTESA and at IN_CORSO"
      - "AC-455 A Conferma or Salta already pending in the per-project scope (AC-418) from BEFORE the re-run was queued, resolving after the replacement, shows AC-318 VoceCambiata or the Voce-not-found message in plain words, never a crash; after the replacement the panel shows the new Voci, all 'da identificare', and is editable again"
      - "AC-461 When the read-only state of AC-452 ends because the re-run FAILED or was CANCELLED (Cambiamento → latest FALLITA or COMPLETATA, Trascritto unchanged) the banner goes away and every action of AC-454 is enabled again, on the same Voci and the same attributed Nomi (nothing lost); the Proposta job starts again — presenter test: stati source IN_CORSO → FALLITA and IN_ATTESA → COMPLETATA"
      - "AC-526 (ADR 0019 §6) With exactly ONE Segmento selected the toolbar shows 'Dai un nome a questa frase ▾': the menu lists the attivo Parlanti (parlanti-attivi), then 'nuovo…' (Nome field, ricorrente preselected, occasionale toggle, Q-7); the action is absent with 0 or >= 2 Segmenti selected and disabled while S3 is read-only (AC-454)"
      - "AC-527 The presenter's case decision (pure; table test on fixture views) matches ADR 0019 §5: (a) the Segmento is on a Voce attributed to P → SoloConferma; (b) it is alone in its Voce → AttribuisciVoce(thatVoce, P); (c) P has Voci here → Sposta(lowest voceId of P); (d) otherwise → NuovaVoce(P | nuovo Nome); every case goes through ComandiVoce.nominaFrase, the presenter never calls a command directly"
      - "AC-528 A confermato Segmento renders a pin marker with the tooltip 'Frase confermata: «Riassegna per somiglianza» non la sposta'; selected alone, the toolbar offers 'Togli conferma' → ConfermaSegmento(false)"
      - "AC-529 While a nominaFrase is pending, that Segmento row shows the ADR 0017 pending state: progress at once; 'In attesa dell'elaborazione…' + 'Annulla' after SOGLIA_ATTESA_VISIBILE_MS; an error (e.g. NomeGiaInUso on step (d)) inline in plain words, the new Voce appearing unnamed"
      - "AC-530 (REWORDED 2026-09-24, Amendment (b).1/(b).6) A 'Riassegna per somiglianza' button in the Voci panel header, enabled iff: >= 2 attivo Parlanti attributed in this Registrazione each have >= 1 Segmento >= 1 000 ms on their Voci (a reference in either mode; derived from trascritto-view + identificazione-voci); S3 is not read-only; no Parlanti command or nominaFrase is pending; no computation, preview or application is in progress. Disabled hint 'Dai un nome ad almeno due persone'. Under the button 'Riferimenti: <Nomi> (frasi confermate) · <Nomi> (tutta la voce)' (a person is 'frasi confermate' iff they have a confirmed Segmento >= 1 s); with >= 1 'tutta la voce' person the line 'Senza una frase confermata uso tutta la voce: il risultato può cambiare se ripeti. Conferma una frase per persona per renderlo stabile.'; attributed attivo Parlanti with no >= 1 s Segmento → 'Non toccate: <Nomi>' (table test on fixture views)"
      - "AC-531 Computing (fake AzioniSomiglianza held by a latch, virtual time): the button area shows 'Confronto le frasi… n di N' with a determinate bar; every editing action of the panel and of the selection toolbar is disabled and no command is invoked (fakes record zero calls); playback and '▶ estratto' still work; with no progress tick for SOGLIA_ATTESA_VISIBILE_MS 'In attesa dell'elaborazione…' is added; 'Annulla' is visible for the whole computation"
      - "AC-532 'Annulla' during the computation → AzioniSomiglianza.annulla(id); the panel returns to its previous state with no error message"
      - "AC-533 (REWORDED, Amendment (b).2) Result texts after Applica: Esito(3, 2) → '3 frasi spostate, 2 incerte (rimaste dov'erano)'; Esito(1, 1) → '1 frase spostata, 1 incerta (rimasta dov'era)'; Errore(TrascrittoCambiato) → 'La trascrizione è cambiata dopo il confronto: ricalcola l'anteprima' (AC-547); any other error → a plain message (AC-404 rule); dismissible, cleared by the next run or by leaving S3"
      - "AC-534 The state (computation, preview, application) comes from the per-project AzioniSomiglianza.stato: a presenter recreated during a computation (the user left S3 and came back) shows it running again with its progress"
      - "AC-535 When S3 turns read-only (AC-452) during a computation, the presenter calls annulla(id)"
      - "AC-536 The presenter never runs calcola, applica or nominaFrase on the UI thread (AC-417 rule; the fakes record their thread)"
      - "AC-545 (NEW, Amendment (b).2) Preview: Anteprima(gruppi, incerte) renders 'Sposterò N frasi, M incerte restano dove sono' (N = sum of frasi; singulars '1 frase', '1 incerta resta dove è'), one line per group '<da> → <a>: <frasi>' with each Voce's current name (identificazione-voci) or 'Voce n', grouped by destination and ordered by (a, da), and the buttons 'Applica' / 'Annulla'; with N = 0 'Nessuna frase da spostare (M incerte restano dove sono)' and only 'Chiudi'; while the preview is shown every editing action of the panel and toolbar is disabled (fakes record zero command calls) and playback / '▶ estratto' work"
      - "AC-546 (NEW) 'Applica' → AzioniSomiglianza.applica(id) exactly once (a double click → one call); during Applicazione both buttons are disabled and no 'Annulla' is offered; 'Annulla' on the preview → annulla(id), the panel returns to its previous state with no message and zero commands; 'Chiudi' (N = 0) → annulla(id)"
      - "AC-547 (NEW) Errore(TrascrittoCambiato) after Applica → the AC-533 text plus a 'Ricalcola' button → calcola(id); no other command is sent and the old preview is never shown again"
      - "AC-548 (NEW) A presenter recreated while in Anteprima (the user left S3 and came back) shows the same preview; when S3 turns read-only (AC-452) during a computation OR a preview the presenter calls annulla(id)"
    notes: "NEW 2026-09-24 (manifest delta 2026-09-24-packaging, user decisions 2026-09-24 — variant A): the Parlanti + Revisione slice of S3 split out of schermata-registrazione so R1 ships S3 read-only (AC-402), following the S2 precedent (schermata-registrazioni / schermata-registrazioni-identificazione). NAMING: this is the S3 PANEL block (singular 'registrazione'); the S2 BADGE block is schermata-registrazioni-identificazione (plural) — both R2, both wired by avvio-parlanti. It extends the S3 presenter (snastro.ui.registrazione) by supplying the optional sources/commands of AC-402: Voci panel (cards, Proposta, 'Conferma', 'altri ▾', 'nuovo…', 'salta', 'cambia', 'Unisci con ▾', merge banner, '▶ estratto') and the transcript selection toolbar ('Riassegna a ▾', 'Dividi voce'). GATED on attesa-mutex-estrazione: this is where the user-facing wait on the native Mutex lives (ConfermaAttribuzione/SaltaVoce/Proposta extract prints); the ADR closing the spike folds its chosen behaviour into these tests_nl. 'salta' is not offered on an attributed Voce (use 'cambia', R24). AMENDED 2026-09-24 (ADR 0017, manifest delta 2026-09-24-mutex): gate attesa-mutex-estrazione SATISFIED; the chosen wait behaviour is AC-411..AC-417 (per-card pending state, 'In attesa dell'elaborazione…' + 'Annulla' after SOGLIA_ATTESA_VISIBILE_MS = 2000 ms, defined once in the S3 presenter). OWNER (rule 10): this block declares, in snastro.ui.registrazione, the per-VoceRef pending-state source with annulla(voceRef) that the presenter reads; avvio-parlanti implements it in a per-project scope (AC-418). 'Annulla' cancels a pending command, it is not a domain command (no new triggers entry). AMENDED 2026-09-24 (ADR 0018 + Amendment 2026-09-24 (b), manifest delta 2026-09-24-ritrascrivi): S3 is READ-ONLY while a re-run is queued or running (user 2026-09-24, replaces ADR 0018 §4 'fully usable'): the panel reads the read-only flag of the S3 presenter (schermata-registrazione, AC-452) and disables every command it triggers; this closes ADR 0018's accepted residual race for S3. No Proposta job while read-only (it would only wait on the Mutex held by the pipeline, ADR 0017). AMENDED 2026-09-24 (ADR 0019 + Amendment 2026-09-24 (b), manifest delta 2026-09-24-semi-automatica): 'Dai un nome a questa frase ▾', the pin marker + 'Togli conferma', and the 'Riassegna per somiglianza' button with compute → PREVIEW → Applica / Annulla (user 2026-09-24). OWNER (rule 10): this block declares in snastro.ui.registrazione the UI port AzioniSomiglianza and ComandiVoce.nominaFrase (boundary ui-azioni-somiglianza); avvio-parlanti implements them in the per-project scope. 'Annulla' / 'Chiudi' / 'Ricalcola' are not domain commands (no triggers entry)."
    sources: "features/trascrizione-con-parlanti/UI/ux-proposal.md S3 (+ R1, R8, R24, amendment 2026-09-24 S3 read-only in R1), manifest delta 2026-09-24-packaging (Part 3 (b), User decisions 2026-09-24)"
  - id: "avvio-coda-elaborazioni"
    type: "adapter"
    context: "piattaforma"
    side: "app"
    wave: 9
    release: "R1"
    module: ":avvio"
    title: "Coda seriale delle Elaborazioni e dispatcher della pipeline"
    consumes:
      - "kernel-pl"
      - "tec-segnalatore-fase"
      - "tec-modelli"
    depends_on:
      - "esegui-elaborazione"
      - "stati-elaborazione"
      - "modelli-provisioning"
    related_adrs:
      - "0004"
      - "0008"
      - "0012"
    tests_nl:
      - "AC-233 All'avvio RecuperaElaborazioniInterrotte gira prima che la coda parta"
      - "AC-234 Con due in_attesa la seconda parte solo quando la prima è terminale"
      - "AC-235 Con i modelli mancanti le Elaborazioni restano in_attesa; quando diventano pronti la coda riparte"
      - "AC-312 (F-C) Se qualcosa sfugge a EseguiProssimaElaborazione.esegui (cancellazione, interrupt, Error come OutOfMemoryError, eccezione inattesa) il dispatcher esegue RecuperaElaborazioniInterrotte prima di prendere l'elemento successivo; lo esegue anche quando un progetto è riaperto senza riavviare l'app — nessuna Elaborazione resta in_corso mentre l'app gira"
      - "AC-313 (F-G) Un abbonato sincrono che fallisce sempre su ElaborazioneAvviata annulla ogni volta la transazione di avvio: il dispatcher non gira a vuoto sull'elemento di testa (tentativi limitati con back-off, poi lo lascia in_attesa per la sessione e lo segnala) e gli altri elementi proseguono"
      - "AC-314 Un solo dispatcher single-thread prende gli elementi: due richieste concorrenti di avanzamento non portano mai due Elaborazioni in_corso (la transizione in_attesa → in_corso non ha controllo di versione e si affida a questo)"
    notes: "PINNED REQUIREMENT (esegui-elaborazione cycle-1 code-review F-G): the start in_attesa → in_corso relies on the SINGLE-THREAD dispatcher (no version check / compare-and-set on that transition) — never run two dispatchers. Carry-over F-C: after anything escapes esegui no run is live, so RecuperaElaborazioniInterrotte runs before the next item and on project re-open. Mutex-wait gate scoped to R2 (delta 2026-09-24-packaging, user decision 2026-09-24): AC-236 moved to avvio-parlanti. In R1 the only native user is the Elaborazione pipeline on this single dispatcher (AC-314); the R1 half of the Mutex contract (serialization, release on exception) is ml-sherpa-motore AC-401."
    sources: "ADR 0004/0008/0012 (+ R12)"
  - id: "avvio-r0"
    type: "adapter"
    context: "piattaforma"
    side: "app"
    wave: 9
    release: "R0"
    module: ":avvio"
    title: "Composition root R0 (Archivio): main, sessione di progetto, import e riproduzione, S1/S2, smoke"
    consumes:
      - "kernel-pl"
      - "eventi-progetto"
      - "tec-registro-progetti"
      - "tec-audio-api"
      - "tec-lettore-audio"
      - "tec-shell-ui"
    depends_on:
      - "ui-fondamenta"
      - "lettore-audio"
      - "schermata-progetti"
      - "schermata-registrazioni"
      - "persistenza-schema"
      - "registro-progetti-file"
      - "repository-sql-progetto"
      - "audio-progetto"
      - "audio-ffmpeg"
    related_adrs:
      - "0004"
      - "0005"
      - "0006"
      - "0010"
      - "0012"
    tests_nl:
      - "AC-237 --smoke apre il progetto fixture (con almeno una Registrazione importata) e salva uno screenshot di S1 e di S2 in avvio/build/smoke/, uscendo con 0 — senza nativi sherpa né modelli installati (R0); avvio-composizione e avvio-parlanti estendono lo smoke alle loro schermate"
      - "AC-238 Una seconda istanza sullo stesso progetto riceve 'progetto già aperto'"
      - "AC-239 SessioneProgetto.crea(cartellaGenitore, nome) crea in cartellaGenitore la cartella <nomeCartella>.snastro/ scelta secondo AC-263/AC-264, con audio/, documenti/, cache/audio/, progetto.db e .lock, e registra il progetto nel RegistroProgetti con percorso = percorso assoluto della cartella effettivamente creata"
      - "AC-263 Il nome della cartella deriva da NomeProgetto (funzione pura, test a tabella): ogni carattere non valido su Windows/macOS/Linux (< > : \" / \\ | ? * e i caratteri di controllo U+0000–U+001F, U+007F) → '_'; spazi e punti iniziali/finali rimossi; troncato a 60 code point (mai spezzando una coppia surrogata) e poi di nuovo ripulito da spazi/punti finali; un nome riservato Windows (CON, PRN, AUX, NUL, COM1–COM9, LPT1–LPT9, senza distinzione di maiuscole) riceve un '_' finale; risultato vuoto → 'progetto'; il suffisso '.snastro' è aggiunto dopo. Es.: 'Riunione 3/10: budget?' → 'Riunione 3_10_ budget_.snastro'; 'con' → 'con_.snastro'; '...' → 'progetto.snastro'; un nome di 80 caratteri → 60 caratteri + '.snastro'"
      - "AC-264 Se <nomeCartella>.snastro esiste già in cartellaGenitore (cartella o file, con la semantica del filesystem: su APFS case-insensitive 'Budget' collide con 'budget'), SessioneProgetto.crea usa '<nomeCartella> (2).snastro', poi ' (3)'… fino al primo nome libero: mai errore, mai sovrascrittura né scrittura dentro la cartella preesistente (il suo contenuto resta byte-identico); la scelta è race-safe (createDirectory atomico, non exists-poi-crea: se il nome viene occupato nel frattempo si passa al numero successivo)"
      - "AC-265 Il Progetto mantiene il nome digitato: CreaProgetto riceve il nome digitato (solo il trim di NomeProgetto, AC-16), mai il nome della cartella; ProgettoAperto.nome, VoceRegistro.nome e ProgettoCreato.nome valgono es. 'Riunione 3/10: budget?' mentre percorso termina con 'Riunione 3_10_ budget_ (2).snastro'; nome vuoto o di soli spazi → NomeProgettoVuoto e nessuna cartella creata"
      - "AC-240 Alla chiusura il registro è aggiornato con numRegistrazioni e ultimaAttivita"
      - "AC-241 Il LettoreAudio ricostruisce un WAV derivato mancante dalla sorgente; senza sorgente riporta non disponibile"
      - "AC-242 Un comando completato produce un Cambiamento su AggiornamentiVista per la sua Registrazione — in R0: AggiungiRegistrazione e ModificaDataRegistrazione (dopo il commit, mai su rollback); S2 si aggiorna senza ricaricare a mano"
      - "AC-350 (R0, vedi AC-341/AC-342) La composizione R0 non fornisce la sezione Parlanti alla shell, costruisce S2 SENZA sorgenti di Trascrizione (AC-342) e non rende raggiungibili S3/S4/S5: nessun abbonato né servizio di Trascrizione, Documento, Parlanti o Modelli è registrato; dopo AggiungiRegistrazione nessuna riga esiste in elaborazione; :avvio parte senza caricare i nativi sherpa e senza modelli installati"
      - "AC-346 Ogni servizio di comando (CreaProgetto, AggiungiRegistrazione, ModificaDataRegistrazione) è costruito con eventi.unitaDiLavoro (la UnitaDiLavoro del DispatcherEventiInMemoria), mai con il delegato grezzo: test end-to-end su databaseInMemoria — AggiungiRegistrazione pubblica RegistrazioneAggiunta senza errore e un abbonato dopo-commit registrato nel test la riceve solo dopo il commit (e mai dopo un rollback)"
      - "AC-347 Le chiamate al RegistroProgetti (registra, aggiorna, elenco, rimuovi) girano FUORI dal thread UI (il lock di file di AC-328 blocca) e un loro errore o eccezione (IOException, lock, file illeggibile) è registrato nel log e non annulla MAI crea/apri/chiudi: con un RegistroProgetti finto che lancia sempre, crea e apri restituiscono Ok con il progetto aperto, chiudi rilascia comunque il .lock, S1 mostra un elenco vuoto"
      - "AC-348 Il file del registro dei progetti recenti sta nella cartella dati per utente del sistema operativo (funzione pura con os, env e user.home iniettati, stessa regola di AC-133/AC-334/AC-335 senza il suffisso modelli): macOS ~/Library/Application Support/snastro/; Windows <LOCALAPPDATA>\\snastro\\ (LOCALAPPDATA assente, vuoto o relativo → <user.home>\\AppData\\Local\\snastro\\); Linux <XDG_DATA_HOME>/snastro/ (assente, vuoto o relativo → <user.home>/.local/share/snastro/); mai dentro una cartella di progetto — test a tabella"
      - "AC-349 SessioneProgetto.apri: una cartella senza progetto.db o non leggibile → CartellaNonValida; un progetto.db con versione di schema più recente → DatabasePiuRecente, senza modificarlo né lasciare il .lock; un progetto spostato viene aperto e ri-registrato con il nuovo percorso assoluto; chiudi rilascia il .lock così che la riapertura (anche da un'altra istanza) riesce"
    notes: "RELEASE PIVOT 2026-09-23 (user decision, dispatch.log (release-plan)): R0 half of the former monolithic avvio-composizione. main(): manual wiring of the R0 graph only — SessioneProgetto crea/apri/chiudi (folder naming AC-263/264/265, .lock, apriDatabaseProgetto), RegistroProgetti (per-OS path AC-348, calls off the UI thread, errors logged and never aborting AC-347), CreaProgetto/AggiungiRegistrazione/ModificaDataRegistrazione over eventi.unitaDiLavoro (AC-346), ElencoProgetti + RegistrazioniDelProgetto read-models, SondaAudio/ArchivioAudio (audio-progetto) for import, LettoreAudio over RiproduttoreWav (WAV rebuilt from the source into cache/audio/, AC-241), ApriEsterno over java.awt.Desktop, AggiornamentiVista fed by after-commit Progetto events (AC-242), shell WITHOUT the Parlanti section (AC-341) and S2 WITHOUT Trascrizione sources (AC-342), --smoke for S1/S2 (AC-237). Carry-overs owned here: registry errors never abort open/create/close and never on the UI thread (fix-batch-6 code-review, mandatory); per-OS app-data path of the registry (registro-progetti-file code-review); eventi.unitaDiLavoro wiring (revisione code-review) — the same rule binds avvio-composizione and avvio-parlanti. USER DECISION 2026-09-23 (folder naming) as recorded on AC-263..265: 60 code points keeps <nome> (NN).snastro within the 255-byte NAME_MAX of APFS/ext4 and NTFS's 255 UTF-16 units; SessioneProgetto.crea never produces CartellaGiaEsistente. The later blocks EXTEND this wiring (they never re-create SessioneProgetto, the dispatcher or LettoreAudio): avvio-composizione (R1) adds Trascrizione/Documento/Modelli, avvio-parlanti (R2) adds Parlanti. Pre-release (not gating): audio-ffmpeg fix-batch-7 (atomic WAV write, RiproduttoreWav playback token/position/flush) improves R0 playback robustness."
    sources: "architecture.md (:avvio), ADR 0010 (+ R3, R15), profile run binding, user decisions 2026-09-23 (folder naming; release pivot R0 Archivio)"
  - id: "avvio-composizione"
    type: "adapter"
    context: "piattaforma"
    side: "app"
    wave: 10
    release: "R1"
    module: ":avvio"
    title: "Composizione R1 (Trascrizione): coda, pipeline, Revisione, Documento, Modelli, S3/S5"
    consumes:
      - "kernel-pl"
      - "eventi-progetto"
      - "eventi-elaborazione"
      - "eventi-revisione"
      - "nomi-per-documento"
      - "tec-modelli"
      - "tec-shell-ui"
      - "tec-modelli-ui"
    depends_on:
      - "avvio-r0"
      - "avvio-coda-elaborazioni"
      - "schermata-registrazione"
      - "schermata-modelli"
      - "repository-sql-trascrizione"
      - "registrazione-da-progetto-tr"
      - "decodifica-trascrizione"
      - "lettore-trascritto-da-trascrizione"
      - "scrittore-documento-md"
      - "abbonato-documento"
      - "modelli-provisioning"
      - "annulla-elaborazione"
    related_adrs:
      - "0004"
      - "0005"
      - "0006"
      - "0008"
      - "0010"
      - "0012"
      - "0014"
      - "0018"
    tests_nl:
      - "AC-351 --smoke (esteso) salva anche gli screenshot di S3 (progetto fixture con un Trascritto completato, etichette 'Voce n') e di S5 in avvio/build/smoke/, uscendo con 0; S1/S2 restano come in AC-237"
      - "AC-329 ServizioModelli (porta di :ui) è implementato in :avvio sopra ProvisioningModelli: ogni variante di snastro.modelli.ErroreModelli è mappata 1:1 nella variante omonima di ErroreServizioModelli (HashNonValido(modelloId), ArchivioNonValido(modelloId), ReteAssente, ScritturaFallita(motivo), DownloadFallito(motivo)) — test a tabella sul mapper; :ui non importa mai snastro.modelli (verificaDipendenzeModuli)"
      - "AC-352 Un'eccezione che sfugge a ProvisioningModelli (IOException o InvalidPathException da scarica() o pronti()) è catturata in :avvio: scarica → StatoModelli.Errore(ScritturaFallita(motivo)), mai un crash né uno stato bloccato in InDownload, e 'Riprova' la ripete; pronti() che lancia all'avvio → Mancanti (l'app parte comunque) — test con un ProvisioningModelli finto che lancia"
      - "AC-353 Una sola istanza di FasiInCorso per progetto aperto è passata sia alla pipeline (SegnalatoreFase di EseguiProssimaElaborazione) sia a StatiElaborazione: una fase segnalata dalla pipeline è visibile nella vista di S2 (test end-to-end con le Finte ML)"
      - "AC-354 ElaborazioneAvviata/Completata/Fallita/Annullata, VociUnite, VoceDivisa, SegmentoRiassegnato e OGNI cambio di fase di FasiInCorso producono un Cambiamento su AggiornamentiVista per la loro Registrazione (così S2 aggiorna stato e fase, AC-205, senza polling) — ElaborazioneAnnullata added 2026-09-24 (ADR 0018 Amendment (b))"
      - "AC-355 La composizione R1 fornisce a S2 le sorgenti di Trascrizione (AC-342 → colonna di stato, campo 'Numero di persone' + 'Trascrivi'/'Riprova', apertura di S3 su completata) e rende raggiungibile S5; NESSUN abbonato sincrono è registrato su RegistrazioneAggiunta (nessun avvio automatico, ADR 0014) e abbonato-documento è registrato come AbbonatoDopoCommit; ogni servizio di comando della Trascrizione usa eventi.unitaDiLavoro (come AC-346); la sezione Parlanti resta assente (AC-341) — REWRITTEN 2026-09-24 (ADR 0014)"
      - "AC-371 (ex AC-NP5, e2e) In R1 AggiungiRegistrazione non crea alcuna Elaborazione: dopo un'importazione nella composizione R1 la tabella elaborazione non ha righe per quella Registrazione, la vista StatiElaborazione la dà NON_AVVIATA e S2 mostra 'Trascrivi' (test end-to-end con la composizione R1 e le Finte ML)"
      - "AC-356 Senza Parlanti (R1) il Documento è generato con un LettoreNomi vuoto (nomi = mappa vuota, registrazioniCon = lista vuota): ogni Voce è resa 'Voce n' (INV-24) e una Revisione committata rigenera il Documento; nessuna classe di :parlanti è istanziata dalla composizione R1"
      - "AC-460 The R1 composition does NOT supply 'Ritrascrivi' to S2: a completata row shows no field and no button (AC-448, second part); it registers no Parlanti subscriber (unchanged)"
      - "AC-478 The R1 composition supplies AnnullaElaborazione to the S2 presenter (over eventi.unitaDiLavoro), and AggiornamentiVistaTrascrizione maps ElaborazioneAnnullata after commit to ONE Cambiamento(registrazioneId). E2E on databaseInMemoria with fake ML ports and a held pipeline: A is in_corso, B and C are queued; cancel B → B has no elaborazione row, S2 shows B 'Trascrivi' (NON_AVVIATA) and C 'In coda (1)'; when A ends the queue runs C, and the fake pipeline is never invoked for B"
    notes: "RELEASE PIVOT 2026-09-23 (user decision, dispatch.log (release-plan)): this block is now the R1 (Trascrizione) half of the former monolithic composition root; the R0 half is avvio-r0 (SessioneProgetto, folder naming AC-239/263/264/265, registry AC-240/347/348, LettoreAudio AC-241, AggiornamentiVista AC-242, smoke S1/S2 AC-237, 'progetto già aperto' AC-238) and the R2 half is avvio-parlanti (AC-315/316/317). It EXTENDS avvio-r0's graph (never re-creates SessioneProgetto, the dispatcher or LettoreAudio): SQL repositories of Trascrizione, the serial queue (avvio-coda-elaborazioni), pipeline adapters with config-driven selection (Finte until the gated ML blocks land — diarizzatore/riconoscitore/vad wire themselves here), Revisione commands, Documento (rigenerazione after commit, empty LettoreNomi AC-356), ServizioModelli over :modelli (AC-329, exceptions caught AC-352), S3/S5. Carry-overs owned here: eventi.unitaDiLavoro wiring for every Trascrizione command (revisione code-review); FasiInCorso ONE shared instance for pipeline + read-model (stati-elaborazione, AC-353) and phase changes emitting a Cambiamento (stati-elaborazione code-review, AC-354); ServizioModelli must catch the IOExceptions escaping scarica()/pronti() (modelli-provisioning cycle-1 code-review, AC-352); RecuperaElaborazioniInterrotte strictly before the dispatcher (owned by avvio-coda-elaborazioni AC-233). AMENDED 2026-09-24 (ADR 0014 / ADR 0012 Amendment (c)): abbonato-registrazione-aggiunta is REMOVED — the composition registers no sync subscriber on RegistrazioneAggiunta; AvviaElaborazione is reached only from S2 ('Trascrivi'/'Riprova' with the optional Numero di persone). tec-modelli percorso(id) is a DIRECTORY (ADR 0008 Amendment (c)); tec-modelli-ui error type is the UI-side ErroreServizioModelli (AC-329). AMENDED 2026-09-24 (delta 2026-09-24-packaging, user decisions 2026-09-24): S3 is built READ-ONLY in R1 (variant A) — the composition supplies it trascritto-view, documento, LettoreAudio and ApriEsterno only (no Parlanti sources, no Revisione commands: explicit cut, the Revisione UI arrives in R2 with schermata-registrazione-identificazione). The Revisione services and their events stay wired (AC-354/AC-356 are proved end-to-end by tests, not from the UI). avvio-coda-elaborazioni is no longer gated (Mutex gate scoped to R2), so this block is buildable once its depends_on are merged. The real ML adapters (ml-sherpa-motore wave 11, the three sherpa adapters wave 12) are built after it and wire themselves here; until then the pipeline runs on the Finte. AMENDED 2026-09-24 (ADR 0018 + Amendment 2026-09-24 (b), manifest delta 2026-09-24-ritrascrivi): wires AnnullaElaborazioneServizio into S2 (R1: first transcriptions can be cancelled while queued) and maps ElaborazioneAnnullata → Cambiamento; does NOT supply 'Ritrascrivi' (R2 only, AC-460). CodaElaborazioni needs no change (no signal on cancellation)."
    sources: "architecture.md (:avvio), ADR 0004/0008/0010/0012, release pivot 2026-09-23 (R1 Trascrizione)"
  - id: "avvio-parlanti"
    type: "adapter"
