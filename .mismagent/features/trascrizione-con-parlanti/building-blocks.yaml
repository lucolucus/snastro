      - "AC-345 La sorgente di identificazione è OPZIONALE per il presenter di S2: assente (R0/R1) o non ancora caricata → nessun badge (mai un conteggio provvisorio o '0 da identificare'); con numVociDaIdentificare = 0 → solo '3 voci'; l'errore di lettura della sorgente lascia la riga senza badge e il resto della riga utilizzabile"
    notes: "RELEASE PIVOT 2026-09-23 (user decision, dispatch.log (release-plan)): split out of schermata-registrazioni so S2 ships in R0 without the Parlanti read-model; extends the S2 presenter's row with the ux-proposal badge (S2 ⨝ identificazione-registrazioni, ux amendment R1). Wired by avvio-parlanti."
    sources: "features/trascrizione-con-parlanti/UI/ux-proposal.md S2 (+ R1), release pivot 2026-09-23"
  - id: "schermata-registrazione-identificazione"
    type: "ui"
    context: "ui"
