  - id: "stile-snastro"
    type: "ui"
    context: "ui"
    side: "app"
    wave: 15
    release: "R2"
    module: ":ui (snastro.ui.stile) + ui/src/main/resources/font, ui/src/main/resources/icone"
    title: "Stile Snastro · tema, colori, tipografia, icone, componenti condivisi"
    consumes:
      - "kernel-pl"
    depends_on:
      - "ui-fondamenta"
    related_adrs:
      - "0001"
      - "0002"
    consumes_rm: []
    triggers: []
    tests_nl:
      - "AC-551 `SnastroColori` is a data class with one `Color` field per colour token of `UI/design-system/tokens.json` (ground, surface, raised, sunken, line, lineStrong, ink, inkMuted, inkFaint, accent, onAccent, accentHover, accentSoft, accentInk, focus, danger, dangerSoft, warning, warningSoft, voci: List<Color>(8)). Two instances `ColoriChiari` / `ColoriScuri` carry the exact hex values of the `light` / `dark` themes. A unit test parses `tokens.json` (copied to `ui/src/test/resources/design-system/tokens.json`) and asserts every field equals its token, both themes — so the Kotlin can never drift from the design system."
      - "AC-552 `SnastroTema(scuro: Boolean = isSystemInDarkTheme())` provides `LocalSnastroColori` and wraps `MaterialTheme` with a `ColorScheme` mapped as README §'Implementazione in Compose': primary = accent, onPrimary = onAccent, background = ground, surface = surface, surfaceContainer = raised, surfaceVariant = sunken, outline = lineStrong, outlineVariant = line, error = danger, onSurface = ink, onSurfaceVariant = inkMuted. Test: both schemes built, mapping asserted."
      - "AC-553 Spacing / radius / size tokens are `Dp` constants in `SnastroMisure` (space1…space7 = 4, 8, 12, 16, 24, 32, 48; radiusControl 6, radiusCard 10, radiusDialog 14, radiusPill = CircleShape; iconS 16, iconM 20, controlS 28, controlM 34, sidebar 232, pannello 320). Screens use these names, never literal dp for these roles (review criterion, and a grep in the block's test: no `RoundedCornerShape(<literal>)` outside `snastro.ui.stile`). — a pre-existing literal in a wave-16-owned screen file may be listed as a temporary exception; the wave-16 owner of that file removes it (AC-589b)"
      - "AC-554 Fonts bundled as static TTF in `ui/src/main/resources/font/`: Instrument Sans (400, 500, 600), Source Serif 4 (400, 600), JetBrains Mono (500). All SIL OFL 1.1; the three `OFL.txt` files sit next to them. No network at runtime."
      - "AC-555 `SnastroTipografia` exposes the 11 styles of tokens.json with exact size/line-height/ weight/letter-spacing: display, title, heading, body, label, caption, overline (UPPERCASE applied by the composable, not in the string), figure (tabular figures via `fontFeatureSettings = 'tnum'`), transcript, abstract (reading family), timecode (mono, `tnum`). Material `Typography` maps bodyMedium = body, labelLarge = label, titleMedium = title, headlineSmall = display, bodySmall = caption."
      - "AC-556 The S5 licences list gains the three fonts (name, role 'Carattere dell'interfaccia' / 'Carattere di lettura' / 'Carattere dei tempi', licence 'SIL OFL 1.1', attribution) — through the same `LicenzaVista` list, appended by the `:avvio` composition (no `:modelli` catalogue change)."
      - "AC-557 (supersedes AC-179's duration half; AC-203's '3:12' now matches) `formattaDurata`: under one hour `m:ss` without a leading zero on minutes (75 003 ms → '1:15', 192 000 → '3:12', 3 599 000 → '59:59'); from one hour `h:mm:ss` (3 600 000 → '1:00:00', 4 503 000 → '1:15:03'). `formattaDurataEstesa` for prose: '52 min', '1 h 04 min'. Dates unchanged ('dd/MM/yyyy'). FormattazioneTest updated to these cases; any presenter test asserting the old '01:15' form is updated in the same commit (listed in the block's report)."
      - "AC-558 The 29 SVGs of `UI/design-system/icone/` are copied to `ui/src/main/resources/icone/`. `enum class Icona { Play, Pause, Replay, Forward, Listen, Import, Document, Reveal, Person, People, Merge, Split, Reassign, Pin, Check, Close, ChevronDown, ChevronRight, Alert, Retry, Clock, Summary, Plus, Trash, Edit, Waveform, Cube, More, Reel }` and `@Composable fun IconaSn(icona, descrizione: String?, tinta: Color = LocalContentColor.current, dimensione: Dp = iconM)` rendering the SVG (`painterResource` / SVG loader of Compose Desktop) with `ColorFilter.tint`. Test: every enum entry resolves to an existing resource (fails on a missing file)."
      - "AC-559 (re-scoped 2026-09-24, verifier D1 finding: the global check is owned by the wave-16 screen blocks) No emoji and no ▶ ⏸ ⏹ glyphs as UI icons in snastro.ui.stile and snastro.ui.testi constants the block touches (test walks src/main/kotlin/snastro/ui/stile); '▶ estratto' becomes 'Estratto' + Icona.Listen"
      - "AC-560 `palette(voceId)` (AC-178 keeps its contract: deterministic by number, cycle of 8) returns `LocalSnastroColori.current.voci[(n-1) mod 8]`, so it follows the theme; it becomes `@Composable` or takes `SnastroColori` explicitly (worker's choice, callers updated). PaletteTest: Voce 1..8 → the tokens voice-1..voice-8 of the active theme; Voce 9 → voice-1."
      - "AC-561 Voice marker: `PallinoVoce(voceId, conNome: Boolean, grande = false)` — filled 10 dp dot when the Voce has a Nome, 2 dp ring (transparent inside) when it has none. `EtichettaVoce` = dot + name (heading weight 600 in ink) or 'Voce n' (weight 500, inkMuted). The voice colour is never used for text."
      - "AC-562 `BottoneSn(variante: Primario|Secondario|Fantasma|Link|Pericolo, piccolo: Boolean, icona: Icona?)`: heights controlM / controlS, radiusControl; Primario = accent fill + onAccent label, hover accentHover; Secondario = raised + 1 dp lineStrong border + ink; Link = accentInk text; Pericolo = danger text. Disabled = inkFaint text, no fill. At most one Primario per screen (review criterion)."
      - "AC-563 `BottoneIconaSn(icona, descrizione)` square controlM/controlS, tooltip = descrizione (TooltipArea), hover sunken."
      - "AC-564 `BottonePlay(inRiproduzione, grande: Boolean, abilitato)`: grande = 40 dp circle accent fill, Play/Pause icon 18 dp onAccent; piccolo = controlS circle accentSoft with accentInk icon 14 dp; disabled = sunken + inkFaint. Replaces every '▶'/'⏸' text button."
      - "AC-565 `ChipStato(tipo)` — pill 24 dp high, label 12/500, icon 14 dp: DaTrascrivere (1 dp lineStrong border, inkMuted, no icon) · InCoda(n) (sunken, Clock, 'In coda · n') · InCorso(fase, trascorso) (accentSoft, pulsing 8 dp accent dot, '<Fase> <m:ss>' with the time in timecode inkMuted) · Trascritta (no fill, Check in accentInk, inkMuted text) · NonRiuscita (dangerSoft, Alert, danger text) · Avviso(testo, icona) (warningSoft, warning text; used for 'Da identificare', 'Ritrascrizione in coda/in corso'). The pulse is 1.6 s and is disabled when the OS 'reduce motion' setting is on (if unavailable on the platform, a constant dot)."
      - "AC-566 `BannerSn(tipo: Info|Avviso|Errore, titolo, testo, azione?)` radiusCard, fills accentSoft / warningSoft / dangerSoft, icon People|Retry|Alert in accentInk / warning / danger, title 600 + one line of body. At most one banner per screen."
      - "AC-567 `CampoSn` (label caption 500 above, 1 dp lineStrong border, raised fill, radiusControl, helper/error caption below; error = danger border + danger helper) and `CampoNumeroPersone` (72 dp wide, centred, tabular, placeholder 'auto'; in rows: controlS, no visible label, tooltip 'Quante persone parlano? Da 1 a 10, oppure lascia vuoto')."
      - "AC-568 `CardSn` = raised + 1 dp line border + radiusCard + space4 padding, NO shadow. `shadow-pop` equivalent (elevation) only on menus, dialogs and the selection toolbar."
      - "AC-569 `MisuratoreFascia(fascia)`: two 12×6 dp pips + the word (forte = both accent, ink word; debole = first accent, inkMuted; nessuna = none, inkMuted). Never a number (INV-20)."
      - "AC-570 Focus: every interactive component draws a 2 dp `focus` ring offset 2 dp when keyboard- focused (render-check fixture with a focused Primario and a focused field)."
      - "AC-571 The render-check harness renders every component fixture in `ColoriChiari` and `ColoriScuri`; PNGs `build/render-check/stile-<componente>-<tema>.png`. The existing contrast check of the harness (if present) runs on both themes; otherwise a unit test asserts the contrast pairs listed in README §Colore (ink/inkMuted on surface+raised ≥ 4.5, accentInk on surface/raised/ accentSoft ≥ 4.5, onAccent on accent/accentHover ≥ 4.5, lineStrong/focus/voci on surface+raised ≥ 3) from `SnastroColori`, both themes."
    notes: "DERIVED OWNER (rule 11) of the ui-kit = the design system's code incarnation, consumed by both wave-16 restyle blocks. Owns the BODY of SnastroTema (ui-fondamenta keeps the call site), Palette.kt values (AC-178 contract kept, AC-560) and formattaDurata (AC-179 duration half superseded by AC-557). Every value comes from features/trascrizione-con-parlanti/UI/design-system/tokens.json; visual targets in features/trascrizione-con-parlanti/UI/design-system/anteprime/. Views only, no presenter/command/read-model change outside AC-557/AC-560."
    sources: "manifest delta 2026-09-24-restyle-ui (part A), features/trascrizione-con-parlanti/UI/design-system/README.md, user decisions 2026-09-24"
  - id: "restyle-shell-elenchi"
    type: "ui"
    context: "ui"
    side: "app"
    wave: 16
    release: "R2"
    module: ":ui (snastro.ui shell, snastro.ui.progetti, snastro.ui.registrazioni, snastro.ui.parlanti, snastro.ui.modelli) + :avvio (font licences, AC-556 wiring only)"
    title: "Restyle · shell, S1 Progetti, S2 Registrazioni, S4 Parlanti, S5 Modelli"
    consumes:
      - "kernel-pl"
      - "tec-shell-ui"
    depends_on:
      - "stile-snastro"
      - "schermata-progetti"
      - "schermata-registrazioni"
      - "schermata-registrazioni-identificazione"
      - "schermata-parlanti"
      - "schermata-modelli"
    related_adrs:
      - "0003"
      - "0018"
    consumes_rm: []
    triggers: []
    tests_nl:
      - "AC-572 Shell: window ground = `ground`; left sidebar 232 dp on `ground` with a 1 dp `line` right border; project selector row (Reel icon in accentInk, name heading ellipsised, ChevronDown); nav items 34 dp (Waveform 'Registrazioni', People 'Parlanti') with a right-aligned count when the data is already in the shell state (no new query), active item = raised fill + line outline + accentInk icon + 600 weight; footer 'Modelli pronti · tutto in locale' (Cube, caption inkMuted) or the S5 state in words. Content area = `surface`, padding space5 vertical / space6 horizontal."
      - "AC-573 S1 Progetti: display title, list rows as `CardSn` list (name heading, 'n registrazioni · ultima attività' caption), 'Nuovo progetto' Primario, 'Apri progetto…' Secondario; empty = EmptyState (Reel icon, 'Nessun progetto', the two actions)."
      - "AC-574 (amended 2026-09-24, D1: the project name is not in RegistrazioniUiStato — it stays in the sidebar; a display title arrives with part B4) S2 header: caption 'n registrazioni · <durata estesa totale>' only if already computable from the rows in state (sum of durataMs — allowed view arithmetic), 'Importa audio…' Primario with Import icon at the right."
      - "AC-575 S2 rows = `anteprime/RecordingRow.html`: one bordered raised container, rows separated by `line`, each row = BottonePlay piccolo · (title heading ellipsised / meta caption: date, duration in timecode, voice dots + summary text when the R2 badge data is present) · right side by state with `ChipStato` + actions exactly as today's behaviour (Trascrivi + CampoNumeroPersone; In coda + Link 'Annulla'; In corso chip; Da identificare Avviso chip; Trascritta chip + (amended 2026-09-24, D1: ADR 0018 [user] keeps the prefilled 'Numero di persone' field + 'Ritrascrivi' ON the row — no More menu for it); Non riuscita: motivo in danger caption in the meta line + prefilled field + Secondario 'Riprova' with Retry icon). Playing row = accentSoft fill. The editable date keeps its behaviour but renders as caption text with an Edit icon on hover (no boxed field at rest)."
      - "AC-576 S2 empty state = DropZone large (Import 28 dp, 'Trascina qui un file audio', 'M4A, MP3, WAV, FLAC · oppure' + 'Scegli file…'); while a drag is over the window the drop zone style `over` (accentInk dashed border, accentSoft fill). Errors of import in a BannerSn Errore."
      - "AC-577 S4 Parlanti: sections 'Ricorrenti' / 'Occasionali' as overline headers; each person row = PallinoVoce-like neutral dot (no voice colour: people have none outside a recording — use inkMuted ring) + name heading + caption (impronte, registrazioni, ultima apparizione) + BottonePlay piccolo + BottoneIcona Edit / More (Promuovi, Elimina…). Elimina dialog = `anteprime/Dialog.html` with Pericolo primary."
      - "AC-578 S5 Modelli: CardSn with total size + Primario 'Scarica'; per-model ProgressBar (6 dp, sunken track, accent fill, label + '412 / 870 MB' timecode); errors as BannerSn Errore with 'Riprova'; licences as a plain table (name, role, licence) in caption/body."
      - "STATES: every existing empty / loading / error state of S1, S2, S4, S5 keeps its AC and its text, rendered with the new components (empty = EmptyState or DropZone, errors = BannerSn Errore or inline danger caption, loading = sunken placeholder rows); all existing presenter tests stay green unmodified"
      - "AC-578b No emoji and no ▶ ⏸ ⏹ glyphs (nor U+1F300–1FAFF) remain as UI icons in the packages this block restyles (snastro.ui shell files, progetti, registrazioni, parlanti, modelli): a test greps those src/main dirs; play/pause become BottonePlay"
    notes: "Views only (rule: presenters, UiStato, commands and read-models unchanged). Same commands and dialogs as today; label changes only where the delta says so. The Da fare / project summary cards of the S2 mockup are PART B (B4, to confirm) — explicit cut. The user approves the wave-16 render-check PNGs before merge."
    sources: "manifest delta 2026-09-24-restyle-ui (part A), features/trascrizione-con-parlanti/UI/design-system/anteprime/Sidebar.html, RecordingRow.html, EmptyState.html, DropZone.html, ScreenProject.html (list part)"
  - id: "restyle-registrazione"
    type: "ui"
    context: "ui"
    side: "app"
    wave: 16
    release: "R2"
    module: ":ui (snastro.ui.registrazione, snastro.ui.lettore)"
    title: "Restyle · S3 Registrazione (intestazione, lettore con corsie delle voci, trascritto, pannello Voci, somiglianza)"
    consumes:
      - "kernel-pl"
      - "tec-lettore-audio"
      - "tec-shell-ui"
    depends_on:
      - "stile-snastro"
      - "schermata-registrazione"
      - "schermata-registrazione-identificazione"
      - "lettore-audio"
    related_adrs:
      - "0017"
      - "0018"
      - "0019"
    consumes_rm: []
    triggers: []
    tests_nl:
      - "AC-579 Player bar (replaces BarraLettore's look; `LettorePresenter` unchanged): raised card, radiusCard, line border; transport = BottoneIcona piccolo Replay ('Indietro di 10 secondi') · BottonePlay grande · BottoneIcona piccolo Forward ('Avanti di 10 secondi'); current time in timecode ink; scrubber = 4 dp sunken track + accent played part + 14 dp raised knob with 2 dp accentInk ring; voice lanes: an 8 dp strip above the track with one rounded rect per Segmento, x = inizioMs/durataMs, width = (fineMs−inizioMs)/durataMs (min 1 dp), colour = palette(voceId); data = the segments already in `RegistrazioneUiStato` (no new source). Without segments (S2 R0 context, no transcript) the strip is not drawn. Duration + a '1×' rate chip only if the lettore port already supports rates — otherwise no chip (no new port in part A). Replay/Forward: only if `AzioniLettore` already has seek; otherwise they are omitted in part A and added by B5. Audio missing = controls at 45 % opacity, disabled, + caption in `warning` with Alert under the bar."
      - "AC-580 Header: caption breadcrumb 'Registrazioni ›' (click = back, existing navigation), title in `display`, caption meta '<data> · <durata estesa> · <n persone[, k da identificare]>' (from state already present), actions right: Secondario 'Apri documento' (Document) + BottoneIcona Reveal ('Mostra nella cartella') + BottoneIcona More (Ritrascrivi, where offered)."
      - "AC-581 Layout: header, player full width, then a two-column split: transcript (flexible, text max 68 ch ≈ 640 dp) and the right panel 320 dp. At window width < 1100 dp the panel stacks under the transcript (render-check at 1024×640 must show no clipped panel)."
      - "AC-582 Transcript segment: 56 dp right-aligned timecode gutter (inkMuted; accentInk when playing) · then 'who' line (PallinoVoce + name 13/600 or 'Voce n' 13/500 inkMuted, Pin icon 14 dp accentInk on a confirmed Segmento with the existing tooltip) · text in `transcript` style. Consecutive Segmenti of the same Voce hide the who line. Hover = sunken; playing = accentSoft; selected = accentSoft + 1.5 dp accentInk inset border, and a 16 dp checked box (accent fill, onAccent Check) replaces the timecode. Rows radiusControl, padding 10/12 dp."
      - "AC-583 Selection toolbar = raised + line border + elevation (shadow-pop), radiusCard: 'n frasi di <Voce>' (500) left, then Secondario piccoli with icons: 'Dai un nome a questa frase' (Person + ChevronDown), 'Riassegna a' (Reassign + ChevronDown), 'Dividi voce' (Split), 'Togli conferma' (Pin), BottoneIcona Close 'Deseleziona'. Enabling/disabling rules unchanged."
      - "AC-584 Right panel header: `Tabs` segmented control with a single tab 'Voci' in part A (the 'Riassunto' tab is B3) showing 'Voci · k da identificare' when k > 0; below it the 'Riassegna per somiglianza' CardSn (title heading + Secondario 'Calcola' or the running/preview states, references caption, disabled hint as caption) — texts and rules of ADR 0019 unchanged."
      - "AC-585 Voice card = `anteprime/VoiceCard.html`: CardSn; head = EtichettaVoce + speaking time caption (sum of the Voce's Segmenti durations — view arithmetic on state) + Fantasma piccolo 'Estratto' (Listen); unnamed with proposal: overline 'Sembra', candidate rows (name heading, type caption, MisuratoreFascia, BottoneIcona Listen), actions: Primario piccolo 'È <Nome del primo>' (Check) — label change of 'Conferma', same command — · Secondario 'Altri' (ChevronDown) · Secondario 'Nuova persona' (Plus) — label of 'nuovo…' — · Link 'Salta'; first recording: caption hint + Primario 'Dai un nome' + Link 'Salta'; named: compact head only + BottoneIcona More (Cambia, Unisci con…). Merge proposal banner = BannerSn Info inside the panel."
      - "AC-586 Menus (Riassegna a, Altri, Unisci con, Dai un nome) = `anteprime/Menu.html`: raised, radiusDialog, elevation, items 32 dp with EtichettaVoce + type caption right, 'Nuova persona…' after a divider."
      - "AC-587 Reassign preview = `anteprime/ReassignPreview.html`: heading 'Sposterò N frasi, M incerte restano dove sono', one row per move 'EtichettaVoce(da) › EtichettaVoce(a)  n' (n tabular, right), references caption, Secondario 'Annulla' + Primario 'Applica'. Computing = ProgressBar + 'Confronto le frasi… n di N' timecode."
      - "AC-588 Read-only banner during a re-run = BannerSn Avviso with the ADR 0018 texts; pending command rows keep the ADR 0017 texts with a caption style."
      - "AC-589 render-check: `ScreenRecording`-equivalent fixtures (named + one unnamed Voce, one playing, one confirmed, one selected; panel with a proposal; preview open) at 1280×800 and 1024×640, light and dark. The composer compares them with `anteprime/ScreenRecording.html` / `ScreenIdentify.html` and shows them to the user before merge."
      - "STATES: loading (skeleton = sunken bars), audio missing (AC-217/403 texts), read-only during a re-run (AC-452/454), pending command (ADR 0017), similarity computing / preview / changed-transcript error (ADR 0019 (b).2) keep their ACs and texts, rendered with the new components; all existing presenter tests stay green unmodified"
      - "AC-589b No emoji and no ▶ ⏸ ⏹ glyphs (nor U+1F300–1FAFF) remain in snastro.ui.registrazione, snastro.ui.lettore and testi/TestiSomiglianza.kt (SIMBOLO_FRASE_CONFERMATA → IconaSn(Icona.Pin)); the AC-553 exception for SchermataPannelloVoci.kt RoundedCornerShape(2.dp) is removed (SnastroMisure constant); after both wave-16 blocks merge, the stile-snastro glyph test is widened to all of :ui src/main (whichever wave-16 block merges second owns the widening)"
    notes: "Views only. Voice lanes read the segments already in RegistrazioneUiStato (no new source). Seek/rate/clickable lanes are PART B (B5, to confirm) — in part A Replay/Forward/rate appear only if AzioniLettore already supports them. The Riassunto tab is PART B (B3) — part A shows the Voci tab only. The user approves the wave-16 render-check PNGs before merge."
    sources: "manifest delta 2026-09-24-restyle-ui (part A), features/trascrizione-con-parlanti/UI/design-system/anteprime/ScreenRecording.html, ScreenIdentify.html, PlayerBar.html, TranscriptSegment.html, VoiceCard.html, SelectionToolbar.html, ReassignPreview.html, Menu.html"
