<!-- @dsCard group="Panels" height=520 subtitle="Voci panel: a proposal, a first-time voice, a named voice" width=360 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>VoiceCard</title></head>
<body style="margin:0;background:var(--surface)">
<div class="sn" style="padding:16px">
<div class="sn-col" style="gap:12px;max-width:320px"><div class="sn-vcard">
<div class="head"><span class="sn-voice unnamed" style="--v:var(--voice-4)"><span class="sn-dot ring"></span><span class="name">Voce 4</span></span><span class="time">6:10</span><button class="sn-btn small ghost" title="Ascolta le frasi più lunghe di questa voce"><span class="sn-icon i-listen " aria-hidden="true"></span>Estratto</button></div>
<div class="sn-col" style="gap:0"><span class="sn-over" style="margin-bottom:6px">Sembra</span><div class="sn-cands"><div class="sn-cand"><div class="who"><span class="n">Paolo</span><span class="k">ricorrente</span></div><span class="sn-fascia forte" title="Somiglianza forte"><span class="pips"><i></i><i></i></span>forte</span><button class="sn-iconbtn small" title="Ascolta Paolo da una registrazione passata"><span class="sn-icon i-listen " aria-hidden="true"></span></button></div><div class="sn-cand"><div class="who"><span class="n">Anna</span><span class="k">ricorrente</span></div><span class="sn-fascia debole" title="Somiglianza debole"><span class="pips"><i></i><i></i></span>debole</span><button class="sn-iconbtn small" title="Ascolta Anna da una registrazione passata"><span class="sn-icon i-listen " aria-hidden="true"></span></button></div><div class="sn-cand"><div class="who"><span class="n">Ospite del 5 marzo</span><span class="k">occasionale</span></div><span class="sn-fascia nessuna" title="Somiglianza nessuna"><span class="pips"><i></i><i></i></span>nessuna</span><button class="sn-iconbtn small" title="Ascolta Ospite del 5 marzo da una registrazione passata"><span class="sn-icon i-listen " aria-hidden="true"></span></button></div></div></div>
<div class="actions"><button class="sn-btn primary small"><span class="sn-icon i-check " aria-hidden="true"></span>È Paolo</button><button class="sn-btn small">Altri<span class="sn-icon i-chevron-down " aria-hidden="true"></span></button><button class="sn-btn small"><span class="sn-icon i-plus " aria-hidden="true"></span>Nuova persona</button><button class="sn-btn link small">Salta</button></div>
</div><div class="sn-vcard">
<div class="head"><span class="sn-voice unnamed" style="--v:var(--voice-2)"><span class="sn-dot ring"></span><span class="name">Voce 2</span></span><span class="time">14:05</span><button class="sn-btn small ghost"><span class="sn-icon i-listen " aria-hidden="true"></span>Estratto</button></div>
<span class="hint">Prima registrazione del progetto: ascolta l'estratto e dai un nome a questa voce.</span>
<div class="actions"><button class="sn-btn primary small"><span class="sn-icon i-plus " aria-hidden="true"></span>Dai un nome</button><button class="sn-btn link small">Salta</button></div>
</div><div class="sn-vcard done">
<div class="head"><span class="sn-voice" style="--v:var(--voice-1)"><span class="sn-dot"></span><span class="name">Marco</span> <span class="kind">ricorrente</span></span><span class="time">21:40</span><button class="sn-iconbtn small" title="Estratto"><span class="sn-icon i-listen " aria-hidden="true"></span></button><button class="sn-iconbtn small" title="Altre azioni: cambia, unisci con…"><span class="sn-icon i-more " aria-hidden="true"></span></button></div>
</div></div>
</div>
</body>
</html>
