<!doctype html>
<html>
<head><meta charset="utf-8"><title>PlayButton</title></head>
<body style="margin:0;background:var(--surface)">
<div class="sn" style="padding:16px">
<div class="sn-row" style="gap:16px">
<button class="sn-play" title="Riproduci"><span class="sn-icon i-play " aria-hidden="true"></span></button>
<button class="sn-play" title="Pausa"><span class="sn-icon i-pause " aria-hidden="true"></span></button>
<button class="sn-play small" title="Riproduci da qui"><span class="sn-icon i-play " aria-hidden="true"></span></button>
<button class="sn-play small" title="Pausa"><span class="sn-icon i-pause " aria-hidden="true"></span></button>
<button class="sn-play small" title="Audio non disponibile" disabled><span class="sn-icon i-play " aria-hidden="true"></span></button>
</div>
</div>
</body>
</html>
