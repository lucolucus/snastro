<!-- @dsCard group="Identity" height=140 subtitle="Voice dot + name (or ring + 'Voce n') + timecode, after an element's own text" width=360 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>FonteChip</title></head>
<body style="margin:0;background:var(--surface)">
<div class="sn" style="padding:16px">
<div class="sn-col" style="gap:12px">
<span class="sn-over">Una FonteChip</span>
<div class="sn-row">
<span class="sn-fchip"><span class="sn-dot" style="--v:var(--voice-1)"></span><span class="name">Marco</span><span class="sn-tc">12:34</span></span>
<span class="sn-fchip unnamed"><span class="sn-dot ring" style="--v:var(--voice-4)"></span><span class="name">Voce 4</span><span class="sn-tc">1:02:05</span></span>
</div>
<span class="sn-over">GruppoFonti (dopo il testo di un elemento)</span>
<div class="sn-col" style="gap:4px;max-width:260px">
<span>Verificare con l'ufficio tecnico i lavori sul tetto.</span>
<div class="sn-row">
<span class="sn-fchip"><span class="sn-dot" style="--v:var(--voice-1)"></span><span class="name">Marco</span><span class="sn-tc">12:34</span></span>
<span class="sn-fchip"><span class="sn-dot" style="--v:var(--voice-3)"></span><span class="name">Maria Antonietta</span><span class="sn-tc">9:52</span></span>
<span class="sn-fchip unnamed"><span class="sn-dot ring" style="--v:var(--voice-4)"></span><span class="name">Voce 4</span><span class="sn-tc">6:10</span></span>
</div>
</div>
</div>
</div>
</body>
</html>
