<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title></head>
<body style="margin:0;background:var(--surface)">
<div class="sn" style="padding:16px">
<div class="sn-col" style="gap:14px">
<div class="sn-row"><button class="sn-btn primary"><span class="sn-icon i-waveform " aria-hidden="true"></span>Trascrivi</button><button class="sn-btn"><span class="sn-icon i-document " aria-hidden="true"></span>Apri documento</button><button class="sn-btn ghost"><span class="sn-icon i-reveal " aria-hidden="true"></span>Mostra nella cartella</button><button class="sn-btn link">Annulla</button></div>
<div class="sn-row"><button class="sn-btn primary small">Applica</button><button class="sn-btn small"><span class="sn-icon i-retry " aria-hidden="true"></span>Riprova</button><button class="sn-btn danger small"><span class="sn-icon i-trash " aria-hidden="true"></span>Elimina…</button><button class="sn-btn primary" disabled>Trascrivi</button><button class="sn-btn small" disabled>Dividi voce</button></div>
</div>
</div>
</body>
</html>
