<!-- @dsCard group="Status" height=120 subtitle="One chip per processing state" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusChip</title></head>
<body style="margin:0;background:var(--surface)">
<div class="sn" style="padding:16px">
<div class="sn-col" style="gap:12px">
<div class="sn-row">
<span class="sn-status idle">Da trascrivere</span>
<span class="sn-status queued"><span class="sn-icon i-clock " aria-hidden="true"></span>In coda · 2ª</span>
<span class="sn-status running"><span class="pulse"></span>Separazione voci <span class="tc">3:12</span></span>
<span class="sn-status done"><span class="sn-icon i-check " aria-hidden="true"></span>Trascritta</span>
<span class="sn-status failed"><span class="sn-icon i-alert " aria-hidden="true"></span>Non riuscita</span>
</div>
<div class="sn-row">
<span class="sn-status running"><span class="pulse"></span>Ritrascrizione · trascrizione <span class="tc">1:05</span></span>
<span class="sn-status queued"><span class="sn-icon i-clock " aria-hidden="true"></span>Ritrascrizione in coda · 1ª</span>
<span class="sn-status warn"><span class="sn-icon i-people " aria-hidden="true"></span>1 voce da identificare</span>
</div></div>
</div>
</body>
</html>
