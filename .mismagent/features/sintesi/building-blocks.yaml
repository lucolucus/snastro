      - "! grep -rnE --include='*.kt' --exclude-dir=build 'StatoRiassunto\\.' . | grep -E '^\\./[^:]*/src/main/' | grep -vE '^\\./sintesi/(dominio/|adattatori/src/[A-Za-z]+/kotlin/snastro/sintesi/adattatori/persistenza/)' | grep -q ."
