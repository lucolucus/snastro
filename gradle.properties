# snastro: proprieta della build (tutti i progetti, build-logic compreso).
#
# Progetti in parallelo e build cache locale: il gate (`./gradlew check --no-daemon --max-workers=2`)
# non gira piu in serie e riusa gli output invariati. Il parallelismo resta limitato da --max-workers.
org.gradle.parallel=true
org.gradle.caching=true

# Memoria dimensionata con prudenza: il gate gira con --max-workers=2 perche la memoria della macchina
# e condivisa con altri gate (worktree in parallelo). Metaspace limitato, dump solo su OOM.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Il daemon Kotlin non eredita i 3g di Gradle: ne basta meno per compilare un modulo alla volta.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m

# Configuration cache NON abilitata: `verificaDipendenzeModuli` legge `subprojects.configurations` in
# esecuzione e non e ancora compatibile (analisi di design B2b).
